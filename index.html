<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Tax Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="https://apis.google.com/js/api.js" async></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .nav-tab { @apply px-4 py-2 text-sm font-medium rounded-md transition-colors; }
    .nav-tab.active { @apply bg-white text-gray-900 shadow-sm; }
    .nav-tab:not(.active) { @apply text-gray-600 hover:text-gray-900; }
    .badge { @apply inline-flex items-center px-2 py-0.5 rounded text-xs font-medium; }
    .badge-us { @apply bg-indigo-100 text-indigo-800; }
    .badge-india { @apply bg-orange-100 text-orange-800; }
    .badge-filed { @apply bg-green-100 text-green-800; }
    .badge-in-progress { @apply bg-amber-100 text-amber-800; }
    .badge-not-started { @apply bg-gray-100 text-gray-600; }
    .badge-na { @apply bg-gray-50 text-gray-400; }
    .badge-overdue { @apply bg-red-100 text-red-800; }
    .card { @apply bg-white rounded-xl border border-gray-200 p-5; }
    .member-card { @apply bg-white rounded-xl border-2 cursor-pointer transition-all hover:shadow-md p-4; }
    .member-card.border-green-400 { border-color: #4ade80; }
    .member-card.border-amber-400 { border-color: #fbbf24; }
    .member-card.border-gray-200 { border-color: #e5e7eb; }
    .member-card.border-blue-300 { border-color: #93c5fd; }
    select { @apply border border-gray-300 rounded-lg px-3 py-1.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500; }
    .btn { @apply px-3 py-1.5 rounded-lg text-sm font-medium transition-colors; }
    .btn-primary { @apply bg-indigo-600 text-white hover:bg-indigo-700; }
    .btn-ghost { @apply text-gray-600 hover:bg-gray-100; }
    table { @apply w-full text-sm; }
    th { @apply text-left text-xs font-medium text-gray-500 uppercase tracking-wide py-2 px-3; }
    td { @apply py-2.5 px-3 border-b border-gray-50; }
    tr:hover td { @apply bg-gray-50; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- TOP NAV -->
<div class="bg-white border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6">
    <div class="flex items-center justify-between h-14">
      <!-- Logo + Year -->
      <div class="flex items-center gap-4">
        <span class="font-semibold text-gray-900 text-base">🗂 Family Tax Planner</span>
        <select id="yearSelect" onchange="setYear(parseInt(this.value))"></select>
      </div>
      <!-- Tabs -->
      <div class="flex items-center gap-1 bg-gray-100 rounded-lg p-1">
        <button class="nav-tab" onclick="navigate('dashboard')">Dashboard</button>
        <button class="nav-tab" onclick="navigate('checklist')">Checklists</button>
        <button class="nav-tab" onclick="navigate('registry')">Gift Registry</button>
        <button class="nav-tab" onclick="navigate('drive')">Drive Scan</button>
        <button class="nav-tab" onclick="navigate('settings')">Settings</button>
      </div>
      <!-- Version -->
      <span class="text-xs text-gray-400">v1.01</span>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="max-w-7xl mx-auto px-6 py-6" id="main"></div>

<script>
// ─── CONSTANTS ────────────────────────────────────────────────────────────────

// optional: ext_month, ext_day, conditional, active_from, notes
const OBLIGATIONS = {
  jawad_chhaya: [

    { id:'us_1040',        label:'Form 1040 (Joint)',       jurisdiction:'US',    cat:'returns',  duo:1, dm:4,  dd:15, em:10, ed:15, notes:'Incl. Schedule B, D, E; Form 1116 (FTC for India income)' },

    // India Returns (India FY is Apr–Mar; ITR due Jul 31 of following calendar year)
    { id:'in_itr_jawad',   label:'ITR-2 — Jawad',          jurisdiction:'India', cat:'returns',  duo:1, dm:7,  dd:31, em:10, ed:31, notes:'India FY Apr–Mar. Includes US income reported for FTC credit.' },
    { id:'in_itr_chhaya',  label:'ITR-2 — Chhaya',         jurisdiction:'India', cat:'returns',  duo:1, dm:7,  dd:31, em:10, ed:31, notes:'India FY Apr–Mar. Includes US income reported for FTC credit.' },
    // India Advance Tax (within the India tax year = same calendar year as US tax year)
    { id:'in_adv_q1',      label:'Advance Tax Q1 (15%)',    jurisdiction:'India', cat:'payments', duo:0, dm:6,  dd:15, notes:'Jun 15. 15% of annual India tax estimate.' },
    { id:'in_adv_q2',      label:'Advance Tax Q2 (45%)',    jurisdiction:'India', cat:'payments', duo:0, dm:9,  dd:15, notes:'Sep 15. Cumulative 45% of annual estimate.' },

    { id:'in_adv_q4',      label:'Advance Tax Q4 (100%)',   jurisdiction:'India', cat:'payments', duo:1, dm:3,  dd:15, notes:'Mar 15 of following year. Balance to 100%.' },

    { id:'k1_chhaya_s',    label:'K-1 → Chhaya (50%)',     jurisdiction:'US',    cat:'k1s',      duo:1, dm:4,  dd:15, notes:'Distributed with 1041.' },

    { id:'in_trust_mariam',label:'India Trust Return',      jurisdiction:'India', cat:'returns',  duo:1, dm:7,  dd:31, active_from:2027, notes:'Nil — income distributed on K-1; beneficiaries pay India tax.' },
    { id:'k1_jawad_m',     label:'K-1 → Jawad (50%)',      jurisdiction:'US',    cat:'k1s',      duo:1, dm:4,  dd:15, active_from:2027 },
    { id:'k1_chhaya_m',    label:'K-1 → Chhaya (25%)',     jurisdiction:'US',    cat:'k1s',      duo:1, dm:4,  dd:15, active_from:2027 },
    { id:'k1_sakina_m',    label:'K-1 → Sakina (12.5%)',   jurisdiction:'US',    cat:'k1s',      duo:1, dm:4,  dd:15, active_from:2027 },
    { id:'k1_aliza_m',     label:'K-1 → Aliza (12.5%)',    jurisdiction:'US',    cat:'k1s',      duo:1, dm:4,  dd:15, active_from:2027 },
  ],
  sakina: [
    { id:'in_itr_sakina',  label:'ITR-2 (India Resident)', jurisdiction:'India', cat:'returns',  duo:1, dm:7,  dd:31, active_from:2027 },
    { id:'us_1040_sakina', label:'Form 1040',               jurisdiction:'US',    cat:'returns',  duo:1, dm:4,  dd:15, em:10, ed:15, active_from:2027, notes:'Incl. Salar K-1, Mariam K-1 (India income + FTC).' },
    { id:'us_fbar_sakina', label:'FinCEN 114 (FBAR)',       jurisdiction:'US',    cat:'returns',  duo:1, dm:4,  dd:15, em:10, ed:15, cond:true, active_from:2027, notes:'If India accounts > $10k.' },
  ],
  aliza: [
    { id:'in_itr_aliza',   label:'ITR-2 (India NRI)',       jurisdiction:'India', cat:'returns',  duo:1, dm:7,  dd:31, active_from:2027 },
    { id:'us_1040_aliza',  label:'Form 1040',               jurisdiction:'US',    cat:'returns',  duo:1, dm:4,  dd:15, em:10, ed:15, active_from:2027, notes:'Incl. earned income, Salar K-1, Mariam K-1 (India income + FTC).' },
    { id:'us_fbar_aliza',  label:'FinCEN 114 (FBAR)',       jurisdiction:'US',    cat:'returns',  duo:1, dm:4,  dd:15, em:10, ed:15, cond:true, active_from:2027, notes:'If India accounts > $10k.' },
  ],
};

// Pre-seeded known filing status
// Structure: { [year]: { [memberId]: { [obligationId]: status } } }
// Statuses: 'filed' | 'in_progress' | 'not_started' | 'na' | 'overdue'
const SEED_STATUS = {
  2022: {
    jawad_chhaya: { us_1040:'filed', us_fbar:'filed', us_709:'filed', us_8938:'na', us_3520:'na',
                    in_itr_jawad:'filed', in_itr_chhaya:'filed',
                    in_adv_q1:'filed', in_adv_q2:'filed', in_adv_q3:'filed', in_adv_q4:'filed' },
    salar_trust:  { us_1041_salar:'filed', k1_chhaya_s:'filed' },
  },
  2023: {
    jawad_chhaya: { us_1040:'filed', us_fbar:'filed', us_709:'filed', us_8938:'na', us_3520:'na',
                    in_itr_jawad:'filed', in_itr_chhaya:'filed',
                    in_adv_q1:'filed', in_adv_q2:'filed', in_adv_q3:'filed', in_adv_q4:'filed' },
    salar_trust:  { us_1041_salar:'filed', k1_chhaya_s:'filed' },
  },
  2024: {
    jawad_chhaya: { us_1040:'filed', us_fbar:'filed', us_709:'na', us_8938:'na', us_3520:'na',
                    in_itr_jawad:'filed', in_itr_chhaya:'filed',
                    in_adv_q1:'filed', in_adv_q2:'filed', in_adv_q3:'filed', in_adv_q4:'filed' },
    salar_trust:  { us_1041_salar:'filed', k1_chhaya_s:'filed' },
  },
  2025: {
    jawad_chhaya: { us_1040:'in_progress', us_fbar:'in_progress', us_709:'na', us_8938:'na', us_3520:'na',
                    in_itr_jawad:'not_started', in_itr_chhaya:'not_started',
                    in_adv_q1:'filed', in_adv_q2:'filed', in_adv_q3:'filed', in_adv_q4:'filed' },
    salar_trust:  { us_1041_salar:'in_progress', k1_chhaya_s:'in_progress' },
  },
  2026: {
    jawad_chhaya: { us_1040:'not_started', us_fbar:'not_started', us_709:'filed', us_8938:'na', us_3520:'na',
                    in_itr_jawad:'not_started', in_itr_chhaya:'not_started',
                    in_adv_q1:'not_started', in_adv_q2:'not_started', in_adv_q3:'not_started', in_adv_q4:'not_started' },
    salar_trust:  { us_1041_salar:'not_started', k1_chhaya_s:'not_started' },
  },
};

// ─── GIFT REGISTRY ────────────────────────────────────────────────────────────
const GIFTS = [
  { year:2012, donors:['Jawad Ayaz','Chhaya Ayaz'], split:true,
    donee:'(per Schedule B — details in 2012 Taxes/Gift Tax/)',
    asset:'Cash', total_fmv:null,
    excl_per_donor:13000, n_donees:1,
    jawad_taxable:400325, chhaya_taxable:400325,
    jawad_credit_used:121910, chhaya_credit_used:121910,
    filed:true, notes:'2012 is the base year for Schedule B cumulative totals.' },
  { year:2022, donors:['Jawad Ayaz','Chhaya Ayaz'], split:true,
    donee:'Sakina Ayaz', asset:'AAPL shares',
    total_fmv:245050, excl_per_donor:16000, n_donees:1,
    jawad_taxable:106525, chhaya_taxable:106525,
    jawad_credit_used:36424, chhaya_credit_used:36424,
    filed:true, notes:'Gift split. File: 2022 Taxes/Jawad.& Chhaya/' },
  { year:2023, donors:['Jawad Ayaz','Chhaya Ayaz'], split:true,
    donee:'Aliza Ayaz', asset:'AMD shares',
    total_fmv:117000, excl_per_donor:17000, n_donees:1,
    jawad_taxable:41500, chhaya_taxable:41500,
    jawad_credit_used:15355, chhaya_credit_used:15355,
    filed:true, notes:'Gift split. File: 2023 Taxes/Jawad & Chhaya/' },
  { year:2026, donors:['Jawad Ayaz','Chhaya Ayaz'], split:true,
    donee:'Salar Holdings Trust FBO Sakina ($2,218,325) & FBO Aliza ($2,305,675)',
    asset:'13,000 AMD shares @ $348/sh',
    total_fmv:4524000, excl_per_donor:38000, n_donees:2,
    jawad_taxable:2224001, chhaya_taxable:2223999,
    jawad_credit_used:881050, chhaya_credit_used:881050,
    filed:true, notes:'Aliza priority $87,351 equalization. Forms filed Apr 27, 2026. File: 2026 Taxes/Jawad & Chhaya/' },
];

// ─── STATE ────────────────────────────────────────────────────────────────────
let state = {
  year: 2025,          // default to "current filing year" (tax year 2025, returns due 2026)
  view: 'dashboard',
  member: 'jawad_chhaya',
  status: {},          // overrides loaded from localStorage
  driveToken: null,
  driveFiles: [],
  gClientId: '',
};

// ─── PERSISTENCE ──────────────────────────────────────────────────────────────
function saveStatus() {
  localStorage.setItem('tax_status', JSON.stringify(state.status));
}
function loadStatus() {
  try {
    const saved = JSON.parse(localStorage.getItem('tax_status') || '{}');
    // Merge seed with user overrides (user override wins)
    for (const yr of YEARS) {
      state.status[yr] = state.status[yr] || {};
      for (const mid of MEMBERS.map(m=>m.id)) {
        state.status[yr][mid] = Object.assign({},
          SEED_STATUS[yr]?.[mid] || {},
          saved[yr]?.[mid] || {}
        );
      }
    }
  } catch { buildSeedStatus(); }
}
function buildSeedStatus() {
  for (const yr of YEARS) {
    state.status[yr] = {};
    for (const mid of MEMBERS.map(m=>m.id)) {
      state.status[yr][mid] = { ...(SEED_STATUS[yr]?.[mid] || {}) };
    }
  }
}
function loadSettings() {
  state.gClientId = localStorage.getItem('google_client_id') || '';
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function fmt(n) {
  if (n == null) return '—';
  return '$' + Number(n).toLocaleString();
}
function getStatus(year, memberId, oblId) {
  return state.status[year]?.[memberId]?.[oblId] || 'not_started';
}
function setStatus(year, memberId, oblId, val) {
  if (!state.status[year]) state.status[year] = {};
  if (!state.status[year][memberId]) state.status[year][memberId] = {};
  state.status[year][memberId][oblId] = val;
  saveStatus();
}
function getObligations(memberId, year) {
  return (OBLIGATIONS[memberId] || []).filter(o => {
    if (o.active_from && year < o.active_from) return false;
    return true;
  });
}
function dueDate(obl, year) {
  // duo = year offset from tax year (0=same year, 1=following year)
  const y = year + (obl.duo || 0);
  return new Date(y, obl.dm - 1, obl.dd);
}
function extDate(obl, year) {
  if (!obl.em) return null;
  const y = year + (obl.duo || 0);
  return new Date(y, obl.em - 1, obl.ed);
}
function isOverdue(obl, year, status) {
  if (status === 'filed' || status === 'na') return false;
  const d = dueDate(obl, year);
  return d < TODAY;
}
function fmtDate(d) {
  if (!d) return '';
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}
function memberForId(id) { return MEMBERS.find(m => m.id === id); }
function obligationProgress(year, memberId) {
  const obls = getObligations(memberId, year);
  if (!obls.length) return { total:0, filed:0, overdue:0, na:0, pct:100 };
  let filed=0, overdue=0, na=0;
  for (const o of obls) {
    const s = getStatus(year, memberId, o.id);
    if (s === 'filed') filed++;
    else if (s === 'na') na++;
    else if (isOverdue(o, year, s)) overdue++;
  }
  const active = obls.length - na;
  return { total:obls.length, filed, overdue, na, active, pct: active ? Math.round(filed/active*100) : 100 };
}
function memberBorderColor(year, memberId) {
  const m = memberForId(memberId);
  if (m.active_from > year) return 'border-gray-200 opacity-50';
  const { filed, overdue, active } = obligationProgress(year, memberId);
  if (overdue > 0) return 'border-red-400';
  if (filed === active) return 'border-green-400';
  if (filed > 0) return 'border-amber-400';
  return 'border-blue-200';
}
function statusBadge(status, label='') {
  const map = {
    filed:       ['badge-filed',       '✓ Filed'],
    in_progress: ['badge-in-progress', '↻ In Progress'],
    not_started: ['badge-not-started', '○ Not Started'],
    na:          ['badge-na',          '– N/A'],
    overdue:     ['badge-overdue',     '⚠ Overdue'],
  };
  const [cls, def] = map[status] || map.not_started;
  return `<span class="badge ${cls}">${label || def}</span>`;
}
function jurisdictionBadge(j) {
  return j === 'US'
    ? `<span class="badge badge-us">US</span>`
    : `<span class="badge badge-india">India</span>`;
}
function categoryLabel(cat) {
  return { returns:'Returns', payments:'Tax Payments', k1s:'K-1 Issuances' }[cat] || cat;
}

// ─── NAVIGATION ───────────────────────────────────────────────────────────────
function navigate(view, memberId) {
  state.view = view;
  if (memberId) state.member = memberId;
  document.querySelectorAll('.nav-tab').forEach((t,i) => {
    const views = ['dashboard','checklist','registry','drive','settings'];
    t.classList.toggle('active', views[i] === view);
  });
  render();
}
function setYear(y) {
  state.year = y;
  render();
}

// ─── RENDER ROUTER ────────────────────────────────────────────────────────────
function render() {
  document.getElementById('yearSelect').value = state.year;
  const main = document.getElementById('main');
  switch (state.view) {
    case 'dashboard': main.innerHTML = renderDashboard(); break;
    case 'checklist': main.innerHTML = renderChecklist(); break;
    case 'registry':  main.innerHTML = renderRegistry(); break;
    case 'drive':     main.innerHTML = renderDriveScan(); break;
    case 'settings':  main.innerHTML = renderSettings(); break;
  }
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function renderDashboard() {
  const yr = state.year;

  // Upcoming deadlines across all members
  const upcoming = [];
  for (const m of MEMBERS) {
    if (m.active_from > yr) continue;
    for (const o of getObligations(m.id, yr)) {
      const s = getStatus(yr, m.id, o.id);
      if (s === 'filed' || s === 'na') continue;
      const d  = dueDate(o, yr);
      const ex = extDate(o, yr);
      const od = d < TODAY;
      upcoming.push({ member:m.label, memberId:m.id, obl:o, due:d, ext:ex, status:s, overdue:od });
    }
  }
  upcoming.sort((a,b) => a.due - b.due);

  // Stats
  let totalFiled=0, totalActive=0, totalOverdue=0;
  for (const m of MEMBERS) {
    if (m.active_from > yr) continue;
    const p = obligationProgress(yr, m.id);
    totalFiled += p.filed;
    totalActive += p.active;
    totalOverdue += p.overdue;
  }

  return `
  <div class="space-y-6">
    <!-- Header -->
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Tax Year ${yr}</h1>
      <p class="text-gray-500 text-sm mt-1">
        US returns due ${yr < CURRENT_YEAR ? 'Apr 15, '+(yr+1) : 'Apr 15, '+(yr+1)} · India ITR due Jul 31, ${yr+1}
      </p>
    </div>

    <!-- Stats row -->
    <div class="grid grid-cols-3 gap-4">
      <div class="card text-center">
        <div class="text-3xl font-bold text-green-600">${totalFiled}</div>
        <div class="text-sm text-gray-500 mt-1">Filed / ${totalActive} active obligations</div>
      </div>
      <div class="card text-center">
        <div class="text-3xl font-bold ${totalOverdue > 0 ? 'text-red-600' : 'text-gray-400'}">${totalOverdue}</div>
        <div class="text-sm text-gray-500 mt-1">Overdue</div>
      </div>
      <div class="card text-center">
        <div class="text-3xl font-bold text-amber-600">${upcoming.filter(u => !u.overdue).length}</div>
        <div class="text-sm text-gray-500 mt-1">Upcoming deadlines</div>
      </div>
    </div>

    <!-- Member cards -->
    <div>
      <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-3">Family & Entities</h2>
      <div class="grid grid-cols-5 gap-3">
        ${MEMBERS.map(m => renderMemberCard(m, yr)).join('')}
      </div>
    </div>

    <!-- Two-column: upcoming deadlines + income flows -->
    <div class="grid grid-cols-3 gap-4">

async function connectDrive() {
  if (!state.gClientId) { alert('Enter Google Client ID in Settings first.'); return; }
  const client = google.accounts.oauth2.initTokenClient({
    client_id: state.gClientId,
    scope: 'https://www.googleapis.com/auth/drive.readonly',
    callback: (resp) => {
      if (resp.error) { alert('Drive auth failed: ' + resp.error); return; }
      state.driveToken = resp.access_token;
      render();
    }
  });
  client.requestAccessToken();
}

async function runDriveScan() {
  if (!state.driveToken) return;
  const yr = state.year;
  // Find the year folder — try a few naming patterns
  const patterns = [`${yr} Taxes`, `${yr} taxes`];
  let folderId = null;

  for (const p of patterns) {
    try {
      const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=name+contains+'${yr}+Taxes'+and+mimeType='application/vnd.google-apps.folder'&fields=files(id,name)`, {
        headers: { Authorization: 'Bearer ' + state.driveToken }
      });
      const data = await r.json();
      if (data.files && data.files.length > 0) { folderId = data.files[0].id; break; }
    } catch {}
  }

  if (!folderId) {
    state.driveFiles = [];
    alert(`No folder found for "${yr} Taxes" in your Drive.`);
    render(); return;
  }

  // List all files recursively under the year folder
  try {
    const r = await fetch(`https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents&fields=files(id,name,mimeType,parents)&pageSize=100`, {
      headers: { Authorization: 'Bearer ' + state.driveToken }
    });
    const data = await r.json();
    state.driveFiles = data.files || [];
  } catch (e) {
    alert('Error scanning Drive: ' + e.message);
  }
  render();
}

          <p class="text-xs text-gray-400 mt-2">On Jawad's death: Chhaya 50%, Sakina 25%, Aliza 25%</p>
        </div>
      </div>
    </div>

    <!-- Filing deadlines reference -->
    <div class="card">
      <h2 class="font-semibold text-gray-900 mb-3">Filing Deadlines Reference</h2>
      <table>
        <thead><tr><th>Return</th><th>Normal Due</th><th>Extension</th></tr></thead>
        <tbody>
          ${[
            ['Form 1040 (US individual)', 'Apr 15', 'Oct 15'],
            ['FinCEN 114 (FBAR)', 'Apr 15', 'Oct 15 (auto)'],
            ['Form 709 (gift tax)', 'Apr 15', 'Oct 15 (with 1040 ext)'],
            ['Form 1041 (trust)', 'Apr 15', 'Sep 30'],
            ['Form 3520', 'Apr 15', 'Oct 15'],
            ['India ITR (individual)', 'Jul 31', 'Oct 31'],
            ['India ITR (audit required)', 'Oct 31', 'Nov 30'],
            ['India Advance Tax Q1', 'Jun 15', '—'],
            ['India Advance Tax Q2', 'Sep 15', '—'],
            ['India Advance Tax Q3', 'Dec 15', '—'],
            ['India Advance Tax Q4', 'Mar 15', '—'],
          ].map(([r,d,e]) => `<tr><td>${r}</td><td class="text-gray-700">${d}</td><td class="text-gray-500">${e}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>

    <!-- Reset -->
    <div class="card bg-red-50 border-red-200">
      <h2 class="font-semibold text-red-800 mb-2">Reset Status Data</h2>
      <p class="text-sm text-red-700 mb-3">Clears all manual status overrides. Pre-seeded data will be restored.</p>
      <button class="btn bg-red-600 text-white hover:bg-red-700 text-sm" onclick="resetStatus()">Reset All Status</button>
    </div>
  </div>`;
}

function saveClientId() {
  state.gClientId = document.getElementById('clientIdInput').value.trim();
  localStorage.setItem('google_client_id', state.gClientId);
  alert('Saved.');
}
function resetStatus() {
  if (!confirm('Reset all filing status overrides?')) return;
  localStorage.removeItem('tax_status');
  buildSeedStatus();
  render();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
function init() {
  // Build year select
  const sel = document.getElementById('yearSelect');
  YEARS.forEach(y => {
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = y === CURRENT_YEAR ? `${y} ▸ Current` : `${y}`;
    sel.appendChild(opt);
  });
  sel.value = state.year;

  loadStatus();
  loadSettings();
  navigate('dashboard');
}

init();
</script>
</body>
</html>
