    .member-card.border-red    { border-color:#f87171; }
    .member-card.border-blue   { border-color:#93c5fd; }
    .member-card.border-gray   { border-color:#e5e7eb; opacity:0.6; }

    .badge-india   { background:#ffedd5; color:#c2410c; }
    .badge-filed   { background:#dcfce7; color:#15803d; }
    .badge-prog    { background:#fef3c7; color:#92400e; }
    .badge-pending { background:#f3f4f6; color:#6b7280; }
    .badge-na      { background:#f9fafb; color:#9ca3af; border:1px solid #e5e7eb; }
    .badge-overdue { background:#fee2e2; color:#991b1b; }

    /* ── Buttons ── */
    .btn { display:inline-flex; align-items:center; padding:6px 14px; border-radius:7px; font-size:13px; font-weight:500; cursor:pointer; border:none; transition:background 0.15s; }
    .btn-primary { background:#4f46e5; color:#fff; }
    .btn-primary:hover { background:#4338ca; }
    .btn-ghost { background:transparent; color:#6b7280; border:1px solid #e5e7eb; }
    .btn-ghost:hover { background:#f9fafb; }
    .btn-danger { background:#dc2626; color:#fff; }
    .btn-danger:hover { background:#b91c1c; }

    /* ── Table ── */
    table { width:100%; border-collapse:collapse; font-size:13.5px; }
    thead th { text-align:left; font-size:11px; font-weight:600; color:#6b7280; text-transform:uppercase; letter-spacing:0.05em; padding:6px 10px 8px; border-bottom:1px solid #e5e7eb; }

    tbody tr:hover td { background:#f9fafb; }

    .status-select { border:1px solid #e5e7eb; border-radius:5px; padding:3px 6px; font-size:12px; color:#374151; background:#f9fafb; cursor:pointer; }

    .progress-track { width:100%; background:#f3f4f6; border-radius:99px; height:4px; margin-top:8px; }

    .jur-india { background:#f97316; }

    .fbar-step { display:flex; align-items:center; gap:6px; padding:6px 16px; font-size:12.5px; font-weight:500; color:#9ca3af; border-radius:0; }
    .fbar-step.active { color:#4f46e5; font-weight:600; }
    .fbar-step.done { color:#16a34a; }
    .fbar-step-sep { color:#d1d5db; font-size:12px; }
    .fbar-drop { border:2px dashed #d1d5db; border-radius:10px; padding:32px; text-align:center; color:#9ca3af; cursor:pointer; transition:border-color 0.15s, background 0.15s; }
    .fbar-drop:hover, .fbar-drop.drag-over { border-color:#6366f1; background:#f5f3ff; color:#4f46e5; }
    .fbar-acct-row { display:grid; grid-template-columns:1fr 120px 100px 80px 80px 60px 32px; gap:6px; align-items:center; padding:8px 0; border-bottom:1px solid #f3f4f6; }

function saveStatus() {
  localStorage.setItem('tp_status', JSON.stringify({...S.status, _ver: STATUS_VER}));
}
function loadAll() {
  try {
    const raw = JSON.parse(localStorage.getItem('tp_status') || '{}');
    // Discard saved data from old schema versions (would override SEED_STATUS with stale not_started values)
    const saved = (raw._ver === STATUS_VER) ? raw : {};
    for (const yr of YEARS) {
      S.status[yr] = {};
      for (const m of MEMBERS) {
        S.status[yr][m.id] = Object.assign({}, SEED_STATUS[yr]?.[m.id] || {}, saved[yr]?.[m.id] || {});
      }
    }
  } catch { YEARS.forEach(yr => { S.status[yr]={}; MEMBERS.forEach(m => { S.status[yr][m.id]={...(SEED_STATUS[yr]?.[m.id]||{})}; }); }); }
  // Restore Drive token from localStorage if not expired
  try {
    const dt = JSON.parse(localStorage.getItem('tp_drive') || '{}');
    if (dt.token && dt.exp && Date.now() < dt.exp) {
      S.driveToken = dt.token;
    } else {
      localStorage.removeItem('tp_drive');
    }
  } catch { localStorage.removeItem('tp_drive'); }
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
const fmt = n => n == null ? '—' : '$' + Number(n).toLocaleString();
const fmtDate = d => d ? d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
const memberById = id => MEMBERS.find(m => m.id === id);

function getObls(mid, yr) {
  return (OBLIGATIONS[mid] || []).filter(o => !(o.active_from && yr < o.active_from));
}
function getStatus(yr, mid, oid) { return S.status[yr]?.[mid]?.[oid] || 'not_started'; }
function setStatus(yr, mid, oid, val) {
  if (!S.status[yr]) S.status[yr]={};
  if (!S.status[yr][mid]) S.status[yr][mid]={};
  S.status[yr][mid][oid] = val; saveStatus();
}
function dueDate(o, yr) { return new Date(yr + (o.duo||0), o.dm-1, o.dd); }
function extDate(o, yr) { return o.em ? new Date(yr + (o.duo||0), o.em-1, o.ed) : null; }
function isOverdue(o, yr, st) { return st!=='filed' && st!=='na' && dueDate(o,yr) < TODAY; }

function progress(yr, mid) {
  const obls = getObls(mid, yr);
  if (!obls.length) return {total:0, filed:0, overdue:0, na:0, active:0, pct:100};
  let filed=0, overdue=0, na=0;
  obls.forEach(o => {
    const s = getStatus(yr, mid, o.id);
    if (s==='filed') filed++;
    else if (s==='na') na++;
    else if (isOverdue(o,yr,s)) overdue++;
  });
  const active = obls.length - na;
  return {total:obls.length, filed, overdue, na, active, pct: active ? Math.round(filed/active*100) : 100};
}

function memberBorder(yr, mid) {
  const m = memberById(mid);
  if (m.active_from > yr) return 'border-gray';
  const {filed, overdue, active} = progress(yr, mid);
  if (overdue > 0) return 'border-red';
  if (active > 0 && filed === active) return 'border-green';
  if (filed > 0) return 'border-amber';
  return 'border-blue';
}

const STATUS_OPTS = [
  {v:'filed',       label:'✓ Filed',       cls:'badge-filed'},
  {v:'in_progress', label:'↻ In Progress', cls:'badge-prog'},
  {v:'not_started', label:'○ Not Started', cls:'badge-pending'},
  {v:'na',          label:'– N/A',         cls:'badge-na'},
  {v:'overdue',     label:'⚠ Overdue',     cls:'badge-overdue'},
];
function statusBadge(s) {
  const o = STATUS_OPTS.find(x=>x.v===s) || STATUS_OPTS[2];
  return `<span class="badge ${o.cls}">${o.label}</span>`;
}
function jurDot(j) {
  return `<span class="jur-dot ${j==='US'?'jur-us':'jur-india'}"></span>`;
}
function jurBadge(j) {
  return `<span class="badge ${j==='US'?'badge-us':'badge-india'}">${j}</span>`;
}
const catLabel = c => ({returns:'Returns', payments:'Tax Payments', k1s:'K-1 Issuances'}[c] || c);

// ─── NAV ──────────────────────────────────────────────────────────────────────
function navigate(view, mid) {
  S.view = view; if (mid) S.member = mid;
  document.querySelectorAll('.nav-tab').forEach((t,i) => {
    t.classList.toggle('active', ['dashboard','checklist','registry','drive','fbar','settings'][i]===view);
  });
  render();
}
function setYear(y) { S.year = y; render(); }

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  document.getElementById('yearSelect').value = S.year;
  const views = {dashboard:renderDashboard, checklist:renderChecklist, registry:renderRegistry, drive:renderDrive, fbar:renderFbar, settings:renderSettings};
  document.getElementById('main').innerHTML = (views[S.view] || renderDashboard)();
  if (S.view === 'fbar') attachFbarListeners();
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function renderDashboard() {
  const yr = S.year;

  // Build deadline rows
  const rows = [];
  for (const m of MEMBERS) {
    if (m.active_from > yr) continue;
    for (const o of getObls(m.id, yr)) {
      const s = getStatus(yr, m.id, o.id);
      if (s==='filed' || s==='na') continue;
      const d = dueDate(o,yr), ex = extDate(o,yr), od = isOverdue(o,yr,s);
      rows.push({member:m.label, memberId:m.id, o, due:d, ext:ex, status:s, od});
    }
  }
  rows.sort((a,b) => a.due-b.due);

  let tFiled=0, tActive=0, tOverdue=0;
  for (const m of MEMBERS) {
    if (m.active_from > yr) continue;
    const p = progress(yr, m.id);
    tFiled += p.filed; tActive += p.active; tOverdue += p.overdue;
  }

  return `
  <div style="display:flex;flex-direction:column;gap:20px">

    <!-- Title -->
    <div>
      <h1 style="font-size:22px;font-weight:700;color:#111827;margin:0">Tax Year ${yr}</h1>
      <p style="font-size:13px;color:#6b7280;margin:4px 0 0">
        US returns due Apr 15, ${yr+1} (Oct 15 with extension) &nbsp;·&nbsp;
        India ITR due Jul 31, ${yr+1}
      </p>
    </div>

    <!-- Stats -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
      <div class="card" style="text-align:center">
        <div style="font-size:32px;font-weight:700;color:#16a34a">${tFiled}</div>
        <div style="font-size:12px;color:#6b7280;margin-top:2px">Filed of ${tActive} active obligations</div>
      </div>
      <div class="card" style="text-align:center">
        <div style="font-size:32px;font-weight:700;color:${tOverdue>0?'#dc2626':'#9ca3af'}">${tOverdue}</div>
        <div style="font-size:12px;color:#6b7280;margin-top:2px">Overdue</div>
      </div>
      <div class="card" style="text-align:center">
        <div style="font-size:32px;font-weight:700;color:#d97706">${rows.filter(r=>!r.od).length}</div>
        <div style="font-size:12px;color:#6b7280;margin-top:2px">Upcoming deadlines</div>
      </div>
    </div>

    <!-- Member cards -->
    <div>
      <div style="font-size:11px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px">Family & Entities</div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">
        ${MEMBERS.map(m => {
          const inactive = m.active_from > yr;
          const {filed, active, overdue} = progress(yr, m.id);
          const pct = active ? Math.round(filed/active*100) : 100;
          const border = memberBorder(yr, m.id);
          const fillColor = overdue>0 ? '#f87171' : pct===100 ? '#4ade80' : '#fbbf24';
          return `
          <div class="member-card ${border}" onclick="navigate('checklist','${m.id}')">
            <div style="font-size:22px;margin-bottom:4px">${m.icon}</div>
            <div style="font-weight:600;font-size:13px;color:#111827">${m.label}</div>
            <div style="font-size:11px;color:#9ca3af;margin-top:2px">${m.subtitle}</div>
            <div style="margin-top:8px;font-size:12px;color:#6b7280">
              ${inactive ? `<span style="color:#9ca3af">Starts ${m.active_from}</span>`
                : `${filed}/${active} filed${overdue>0?` · <span style='color:#dc2626'>${overdue} overdue</span>`:''}`}
            </div>
            ${!inactive ? `<div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${fillColor}"></div></div>` : ''}
          </div>`;
        }).join('')}
      </div>

            ${rows.slice(0,14).map(r => `
            <tr style="${r.od?'background:#fff5f5':''}">
              <td style="padding:9px 4px 9px 10px">${jurDot(r.o.jur)}</td>
              <td style="font-size:13.5px;color:#111827;font-weight:500">
                ${r.o.label}

        </div>
        <div class="card" style="background:#faf5ff;border-color:#e9d5ff">
          <div style="font-weight:600;color:#7e22ce;font-size:13px;margin-bottom:6px">Trust K-1 Flows</div>
          <div style="font-size:12px;color:#6b21a8;line-height:1.6">
            <b>Salar:</b> Chhaya 50%, Sakina 25%, Aliza 25%<br>
            <b>Mariam:</b> Jawad 50%, Chhaya 25%, Sakina 12.5%, Aliza 12.5%<br>
            <span style="color:#9ca3af">(Mariam India income starts 2027)</span>

function connectDrive() {
  if (typeof google === 'undefined' || !google.accounts?.oauth2) {
    alert('Google Identity Services is still loading — please wait a moment and try again.');
    return;
  }
  try {
    google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/drive.readonly',
      callback: r => {
        if (r.error) {
          alert('Google auth error: ' + r.error + (r.error_description ? '\n' + r.error_description : ''));
          return;
        }
        S.driveToken = r.access_token;
        // Persist token for the browser session (expires_in is typically 3600s; use 55 min to be safe)
        const exp = Date.now() + (r.expires_in ? (r.expires_in - 300) * 1000 : 55 * 60 * 1000);
        localStorage.setItem('tp_drive', JSON.stringify({token: r.access_token, exp}));
        render();
      },
      error_callback: e => {
        alert('Auth failed: ' + (e.message || e.type || JSON.stringify(e)));
      }
    }).requestAccessToken({ prompt: '' });
  } catch(e) {
    alert('Could not start auth: ' + e.message);
  }
}

async function driveGet(url) {
  const r = await fetch(url, { headers:{Authorization:'Bearer '+S.driveToken} });
  if (r.status === 401) {
    S.driveToken = null; localStorage.removeItem('tp_drive'); render();
    throw new Error('Drive session expired — please reconnect.');
  }
  if (!r.ok) throw new Error(`Drive API ${r.status}: ${await r.text()}`);
  return r.json();
}

function driveUrl(q, fields, pageSize) {
  const base = 'https://www.googleapis.com/drive/v3/files';
  return `${base}?q=${encodeURIComponent(q)}&fields=${encodeURIComponent(fields)}&pageSize=${pageSize||200}`;
}

async function runScan() {
  if (!S.driveToken) return;
  S.driveFiles = {};
  try {
    // 1. Find "US taxes" root folder
    const root = await driveGet(driveUrl(
      `name='US taxes' and mimeType='application/vnd.google-apps.folder' and trashed=false`,
      'files(id,name)', 5
    ));
    const usTaxesFolder = root.files?.[0];
    if (!usTaxesFolder) { alert('"US taxes" folder not found in Drive.'); return; }

    // 2. Find "{year} Taxes" subfolder
    const yearRes = await driveGet(driveUrl(
      `'${usTaxesFolder.id}' in parents and name='${S.year} Taxes' and mimeType='application/vnd.google-apps.folder' and trashed=false`,
      'files(id,name)', 5
    ));
    const yearFolder = yearRes.files?.[0];
    if (!yearFolder) { alert(`"${S.year} Taxes" folder not found inside "US taxes".`); return; }

    // 3. List taxpayer subfolders directly inside year folder
    const subRes = await driveGet(driveUrl(
      `'${yearFolder.id}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`,
      'files(id,name)', 20
    ));
    const subfolders = subRes.files || [];

    // 4. For each subfolder, map it to a member ID and list its files
    await Promise.all(subfolders.map(async folder => {
      const match = FOLDER_MAP.find(fm => fm.pattern.test(folder.name));
      if (!match) return;
      const filesRes = await driveGet(driveUrl(
        `'${folder.id}' in parents and not mimeType='application/vnd.google-apps.folder' and trashed=false`,
        'files(id,name)', 100
      ));
      S.driveFiles[match.mid] = filesRes.files || [];
    }));

    const total = Object.values(S.driveFiles).reduce((n, a) => n + a.length, 0);
    if (total === 0) alert(`No files found under "${S.year} Taxes". Check folder structure.`);
  } catch(e) { alert('Scan error: ' + e.message); }
  render();
}

// PDF.js worker path (set once when library loads)
function initPdfWorker() {
  if (typeof pdfjsLib !== 'undefined' && !pdfjsLib.GlobalWorkerOptions.workerSrc) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
}

async function extractTextFromFile(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith('.csv')) return file.text();
  if (name.endsWith('.xls') || name.endsWith('.xlsx')) {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    return wb.SheetNames.map(s => XLSX.utils.sheet_to_csv(wb.Sheets[s])).join('\n');
  }
  // PDF — try XFA first, then PDF.js
  const buf = await file.arrayBuffer();
  const bytes = new Uint8Array(buf);

  async function tryDecompress(chunk) {
    const attempts = [['deflate', chunk], ['deflate-raw', chunk]];
    if (chunk.length > 2 && chunk[0] === 0x78) attempts.push(['deflate-raw', chunk.slice(2)]);
    for (const [fmt, data] of attempts) {
      try {
        const inputStream = new ReadableStream({ start(c) { c.enqueue(data); c.close(); } });
        const reader = inputStream.pipeThrough(new DecompressionStream(fmt)).getReader();
        const parts = [];
        while (true) { const { done, value } = await reader.read(); if (done) break; parts.push(value); }
        const out = new Uint8Array(parts.reduce((a,b) => a+b.length, 0));
        let off = 0; parts.forEach(p => { out.set(p, off); off += p.length; });
        return new TextDecoder('utf-8', { fatal:false }).decode(out);
      } catch(_) {}
    }
    return null;
  }
  function matchAt(arr, pos, marker) {
    if (pos+marker.length > arr.length) return false;
    for (let k=0; k<marker.length; k++) if (arr[pos+k]!==marker[k]) return false;
    return true;
  }
  const SM1=[115,116,114,101,97,109,10], SM2=[115,116,114,101,97,109,13,10], EM=[101,110,100,115,116,114,101,97,109];
  const chunks = [];
  for (let i=0; i<bytes.length-10; i++) {
    if (bytes[i]!==115) continue;
    let skip=0;
    if (matchAt(bytes,i,SM1)) skip=SM1.length;
    else if (matchAt(bytes,i,SM2)) skip=SM2.length;
    if (!skip) continue;
    const start = i+skip;
    let end = -1;
    for (let j=start; j<bytes.length-9; j++) {
      if (bytes[j]===101 && matchAt(bytes,j,EM)) { end=j; break; }
    }
    if (end>start) {
      let dataEnd=end;
      if (dataEnd>start && bytes[dataEnd-1]===10) dataEnd--;
      if (dataEnd>start && bytes[dataEnd-1]===13) dataEnd--;
      chunks.push(bytes.slice(start, dataEnd));
      i = end+EM.length-1;
    }
  }
  // The FBAR PDF has TWO streams containing ffbar:BSAForm:
  // 1. A schema/description stream (no actual account data)
  // 2. The data stream (with real institution names and balances)
  // We must try parsing accounts from each matching stream and return
  // the first one that yields actual account records.
  let fallbackXfaText = null;
  for (const chunk of chunks) {
    const text = await tryDecompress(chunk);
    if (!text || !text.includes('ffbar:BSAForm')) continue;
    const normalized = text.replace(/\n>/g, '>');
    if (tryParseXFAAccounts(normalized).length > 0) return normalized; // data stream found
    if (!fallbackXfaText) fallbackXfaText = normalized; // keep schema as fallback
  }
  if (fallbackXfaText) return fallbackXfaText; // XFA found but no parseable accounts yet

  // Standard PDF via PDF.js
  initPdfWorker();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  for (let p=1; p<=pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    let lastY = null;
    for (const item of content.items) {
      if (lastY!==null && Math.abs(item.transform[5]-lastY)>5) text += '\n';
      text += item.str + ' ';
      lastY = item.transform[5];
    }
    text += '\n';
  }
  text = text
    .replace(/(\d{1,3}(?:,\d{2})*,\d{1,2})[ \t]+(\d{1,2})(?!\d)/g, '$1$2')
    .replace(/(\d{1,3}(?:,\d{2})*)[ \t]+(\d{3})(?!\d)/g, '$1,$2');
  return text;
}

function tryParseXFAAccounts(text) {
  if (!text || !text.includes('ffbar:BSAForm')) return [];
  const ns = 'http://www.fincen.gov/bsa/ffbar/2011-06-01';
  const TYPE_MAP = { A:'bank', B:'brokerage', S:'brokerage', M:'mf', Z:'other', C:'other' };
  const doc = new DOMParser().parseFromString(text, 'text/xml');
  function xget(el, localName) {
    const byNS = el.getElementsByTagNameNS(ns, localName);
    if (byNS.length) return byNS[0].textContent?.trim() || '';
    const byPfx = el.getElementsByTagName('ffbar:'+localName);
    if (byPfx.length) return byPfx[0].textContent?.trim() || '';
    const byBare = el.getElementsByTagName(localName);
    if (byBare.length) return byBare[0].textContent?.trim() || '';
    return '';
  }
  const accounts = [];
  for (const tag of ['FinAcctOwnedSeparately','FinAcctOwnedJointly','FinAcctSigAuth']) {
    const ownership = tag==='FinAcctOwnedSeparately' ? 'sole' : tag==='FinAcctOwnedJointly' ? 'joint' : 'sigauth';
    const els = doc.getElementsByTagNameNS(ns, tag).length
      ? doc.getElementsByTagNameNS(ns, tag) : doc.getElementsByTagName('ffbar:'+tag);
    for (const el of els) {
      const name = xget(el, 'FinInstName');
      if (!name) continue;
      const num = xget(el, 'AccntNumber');
      const typ = xget(el, 'AccountType');
      const maxv = parseFloat(xget(el, 'MaximumAccntValue') || '0');
      const digits = num.replace(/\D/g,'');
      const last4 = digits.length>=4 ? digits.slice(-4) : (digits || num.slice(-4));
      accounts.push({
        institution_name: name, account_number: last4 ? `****${last4}` : num || '????',
        account_type: TYPE_MAP[typ] || 'other', ownership,
        max_value_usd: maxv, year_end_value_usd: maxv,
      });
    }
  }
  return accounts;
}

// Parse FBAR accounts from plain PDF text (fallback when XFA not present).
// Handles FinCEN 114 PDFs exported from BSA e-filing (field-label/value layout).
function parseFbarTextAccounts(text) {
  if (!text || text.length < 200) return [];
  const accounts = [];
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

  // ── Strategy 1: field-label scan ──────────────────────────────────────────
  // BSA FinCEN 114 form exports render as label on one line, value on next.
  // Labels we care about (case-insensitive):
  const INST_RE    = /financial institution|bank.*name|name.*institution/i;
  const ACCT_RE    = /account number|account.*designat/i;
  const MAX_RE     = /maximum value|max.*value|maximum.*account/i;
  const TYPE_RE    = /type of account|account.*type/i;
  const OWN_RE     = /ownership.*type|type.*ownership/i;
  const TYPE_MAP_T = { bank:'bank', securities:'brokerage', brokerage:'brokerage',
                       mutual:'mf', fund:'mf', other:'other' };

  let cur = null;
  function flush() { if (cur && cur.name) { accounts.push(cur); } cur = null; }

  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    const next = lines[i+1] || '';
    const next2 = lines[i+2] || '';

    if (INST_RE.test(l)) {
      flush();
      // Value is next non-empty, non-label line
      const val = next && !INST_RE.test(next) && !ACCT_RE.test(next) ? next : next2;
      if (val && val.length > 2 && val.length < 80 && !/^\d+$/.test(val)) {
        cur = { name:val, number:'????', type:'bank', ownership:'sole',
                max_value_usd:0, year_end_value_usd:0 };
      }
    } else if (cur && ACCT_RE.test(l)) {
      const val = next && !ACCT_RE.test(next) ? next : next2;
      if (val) {
        const digits = val.replace(/\D/g,'');
        cur.number = digits.length >= 4 ? `****${digits.slice(-4)}` : val;
      }
    } else if (cur && MAX_RE.test(l)) {
      const snippet = next + ' ' + next2;
      const m = snippet.match(/[\$\₹]?\s*([\d,]+(?:\.\d{1,2})?)/);
      if (m) cur.max_value_usd = parseFloat(m[1].replace(/,/g,''));
    } else if (cur && TYPE_RE.test(l)) {
      const val = (next||'').toLowerCase();
      for (const [k,v] of Object.entries(TYPE_MAP_T)) { if (val.includes(k)) { cur.type=v; break; } }
    } else if (cur && OWN_RE.test(l)) {
      if (/joint/i.test(next)) cur.ownership = 'joint';
    }
  }
  flush();
  if (accounts.length > 0) return accounts;

  // ── Strategy 2: block scan ────────────────────────────────────────────────
  // Some FBAR exports put institution + account + amount on consecutive lines
  // in a repeating block pattern. Heuristic: find capitalized institution-like
  // lines followed within 5 lines by a dollar amount.
  const skipRe = /^(name|account|number|type|value|maximum|report|period|filer|part|page|\d+)$/i;
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (l.length < 4 || l.length > 80) continue;
    if (skipRe.test(l)) continue;
    if (!/^[A-Z]/.test(l)) continue;
    if (/\b(street|road|nagar|colony|park|floor|plot)\b/i.test(l)) continue;
    // Look for an amount within 5 lines
    let foundAmt = 0, foundNum = null;
    for (let j = i+1; j <= Math.min(i+5, lines.length-1); j++) {
      const m = lines[j].match(/\$?\s*([\d,]{4,}(?:\.\d{1,2})?)/);
      if (m) { foundAmt = parseFloat(m[1].replace(/,/g,'')); break; }
      const numM = lines[j].match(/\*{2,}(\d{3,})/);
      if (numM) foundNum = `****${numM[1].slice(-4)}`;
    }
    if (foundAmt > 0) {
      // Check we haven't already added this institution
      if (!accounts.find(a => a.name === l)) {
        accounts.push({ name:l, number:foundNum||'????', type:'bank', ownership:'sole',
          max_value_usd:foundAmt, year_end_value_usd:foundAmt });
      }
    }
  }
  return accounts;
}

function extractAmounts(text) {
  const results = [];
  const re = /(?:₹|Rs\.?\s*)?(\d{1,3}(?:,\d{2})*(?:,\d{3})|\d{4,})(?:\.\d{1,2})?(?!\d)/g;
  for (const m of text.matchAll(re)) {
    const n = parseFloat(m[1].replace(/,/g,''));
    if (n >= 1000) results.push(n);
  }
  return results;
}

function extractLabeledAmounts(text) {
  const lower = text.toLowerCase();
  const labeled = [];
  const keywords = [
    'pre-tax nav','post-tax nav','pre tax nav','post tax nav','nav','net asset value',
    'current value','portfolio value','market value','total value',
    'closing balance','net balance','available balance','account balance',
    'total amount','year end value','yearend','balance as on','value as on',
  ];
  for (const kw of keywords) {
    let pos = 0;
    while ((pos = lower.indexOf(kw, pos)) !== -1) {
      const snippet = text.slice(pos, pos+150);
      const re = /(\d{1,3}(?:,\d{2})*(?:,\d{3})|\d{5,})(?:\.\d{1,2})?/g;
      for (const m of snippet.matchAll(re)) {
        const n = parseFloat(m[1].replace(/,/g,''));
        if (n >= 1000) labeled.push({ label:kw, value:n });
      }
      pos += kw.length;
    }
  }
  return labeled;
}

function findAccountInText(accountName, fullText) {
  const norm = s => s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
  const words = norm(accountName).split(' ').filter(w => w.length > 2);
  if (!words.length) return null;
  const lowerText = fullText.toLowerCase();
  const WIN=700, STEP=50;
  let bestScore=0, bestPos=0;
  for (let i=0; i<=Math.max(0,lowerText.length-WIN); i+=STEP) {
    const chunk = lowerText.slice(i, i+WIN);
    const hits = words.filter(w => chunk.includes(w)).length;
    const score = hits/words.length;
    if (score > bestScore) { bestScore=score; bestPos=i; }
  }
  if (bestScore < 0.3) return null;
  const start = Math.max(0, bestPos-100);
  const end = Math.min(fullText.length, bestPos+WIN+400);
  const region = fullText.slice(start, end);
  const labeledVals = extractLabeledAmounts(region).map(l=>l.value).sort((a,b)=>b-a);
  const allAmts = extractAmounts(region).sort((a,b)=>b-a);
  const peakBalance = labeledVals[0] || allAmts[0] || 0;
  let yearEndBalance = peakBalance;
  const dec31pos = region.search(/(?:31[\s/-]?dec|december[\s/-]?31|31\/12)/i);
  if (dec31pos !== -1) {
    const snip = region.slice(dec31pos, dec31pos+200);
    const found = extractAmounts(snip).sort((a,b)=>b-a);
    if (found.length > 0) yearEndBalance = found[0];
  }
  return { score:bestScore, peakBalance, yearEndBalance };
}

// Attach event listeners after render (DOM must exist)
function attachFbarListeners() {
  const fb = S.fbar;

  // ── Setup step ──
  if (fb.step === 'setup') {
    document.getElementById('fbarYear')?.addEventListener('change', e => { fb.year = parseInt(e.target.value); });
    document.getElementById('fbarName')?.addEventListener('input', e => { fb.filerName = e.target.value; });

    const priorInput = document.getElementById('fbarPriorInput');
    priorInput?.addEventListener('change', async e => {
      const file = e.target.files?.[0];
      if (!file) return;
      fb._priorFileName = file.name;
      fb._priorError = null; fb._priorMsg = null;
      render();
      try {
        const text = await extractTextFromFile(file);
        // Try XFA first (ideal — FinCEN BSA format)
        let rawAccts = tryParseXFAAccounts(text);
        let method = 'XFA';
        // Fallback: text-based parser for printed/exported PDFs
        if (!rawAccts.length) {
          rawAccts = parseFbarTextAccounts(text);
          method = 'text';
        }
        if (rawAccts.length > 0) {
          fb.accounts = rawAccts.map((a,i) => ({
            id: String(i+1),
            name: a.institution_name || a.name || '',
            number: a.account_number || a.number || '????',
            type: a.account_type || a.type || 'bank',
            ownership: a.ownership || 'sole',
            include: true, source: 'fbar',
            priorMax: a.max_value_usd || null,
            priorYearEnd: a.year_end_value_usd || null,
            newMax: null, newYearEnd: null, matchFile: null, matchStatus: 'pending',
          }));
          fb._priorMsg = `✓ Extracted ${rawAccts.length} account(s) from PDF (${method}) — review on next screen`;
        } else {
          fb._priorMsg = 'Could not extract accounts automatically — add manually on the next screen.';
        }
      } catch(e) { fb._priorError = 'Could not read PDF: ' + e.message; }
      render();
    });

    const drop = document.getElementById('fbarPriorDrop');
    drop?.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag-over'); });
    drop?.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
    drop?.addEventListener('drop', e => {
      e.preventDefault(); drop.classList.remove('drag-over');
      const file = e.dataTransfer.files?.[0];
      if (file && file.name.endsWith('.pdf')) {
        const dt = new DataTransfer(); dt.items.add(file);
        document.getElementById('fbarPriorInput').files = dt.files;
        document.getElementById('fbarPriorInput').dispatchEvent(new Event('change'));
      }
    });

    document.getElementById('fbarSetupNext')?.addEventListener('click', () => {
      fb.year = parseInt(document.getElementById('fbarYear').value);
      fb.filerName = document.getElementById('fbarName').value;
      fb.step = 'accounts';
      // Fetch FX rate
      if (!fb.fxRate) {
        fetch(`${FBAR_WORKER}/api/fx?year=${fb.year}`)
          .then(r => r.ok ? r.json() : null)
          .then(d => { if (d?.rate) { fb.fxRate = d.rate; render(); } })
          .catch(() => {});
      }
      render();
    });
  }

  // ── Accounts step ──
  if (fb.step === 'accounts') {
    document.getElementById('fbarAcctBack')?.addEventListener('click', () => { fb.step='setup'; render(); });

    // Import drop zone
    const importInput = document.getElementById('fbarImportInput');
    importInput?.addEventListener('change', async e => {
      const file = e.target.files?.[0];
      if (!file) return;
      e.target.value = '';
      fb._importMsg = null; fb._importErr = null;
      render();
      try {
        const added = await importAccountsFromFile(file);
        if (added > 0) {
          fb._importMsg = `✓ Added ${added} account(s) from ${file.name}`;
        } else {
          fb._importErr = `No accounts found in ${file.name} — add manually below`;
        }
      } catch(e2) { fb._importErr = 'Could not read file: ' + e2.message; }
      render();
    });
    const importDrop = document.getElementById('fbarImportDrop');
    importDrop?.addEventListener('dragover', e => { e.preventDefault(); importDrop.classList.add('drag-over'); });
    importDrop?.addEventListener('dragleave', () => importDrop.classList.remove('drag-over'));
    importDrop?.addEventListener('drop', e => {
      e.preventDefault(); importDrop.classList.remove('drag-over');
      const file = e.dataTransfer.files?.[0];
      if (file) { const dt = new DataTransfer(); dt.items.add(file); importInput.files = dt.files; importInput.dispatchEvent(new Event('change')); }
    });

    document.getElementById('fbarAddAcct')?.addEventListener('click', () => {
      fb.accounts.push({ id:String(Date.now()), name:'', number:'', type:'bank', ownership:'sole',
        include:true, source:'manual', priorMax:null, priorYearEnd:null,
        newMax:null, newYearEnd:null, matchFile:null, matchStatus:'pending' });
      render();
      // Scroll new row into view
      const rows = document.querySelectorAll('.fbar-acct-row[id]');
      if (rows.length) rows[rows.length-1].scrollIntoView({ behavior:'smooth', block:'center' });
    });

    document.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', () => {
        fb.accounts.splice(parseInt(btn.dataset.del), 1);
        render();
      });
    });

    document.querySelectorAll('[data-ai]').forEach(el => {
      const i = parseInt(el.dataset.ai), field = el.dataset.f;
      // change: update state immediately (no re-render — avoids killing DOM during click events)
      el.addEventListener('change', () => {
        if (!fb.accounts[i]) return;
        if (field === 'include') fb.accounts[i][field] = el.checked;
        else if (field === 'priorMax') fb.accounts[i][field] = el.value ? parseFloat(el.value) : null;
        else fb.accounts[i][field] = el.value;
      });
      // blur: update state only, defer any render so pending clicks still fire
      el.addEventListener('blur', () => {
        if (!fb.accounts[i]) return;
        if (field === 'priorMax') fb.accounts[i][field] = el.value ? parseFloat(el.value) : null;
        else if (field !== 'include') fb.accounts[i][field] = el.value;
      });
    });

    document.getElementById('fbarAcctNext')?.addEventListener('click', () => { fb.step='match'; render(); });
  }

  // ── Match step ──
  if (fb.step === 'match') {
    document.getElementById('fbarMatchBack')?.addEventListener('click', () => { fb.step='accounts'; render(); });
    document.getElementById('fbarMatchNext')?.addEventListener('click', () => { fb.step='export'; render(); });

    const stmtInput = document.getElementById('fbarStmtInput');
    stmtInput?.addEventListener('change', e => {
      addFbarFiles(Array.from(e.target.files));
      e.target.value = '';
    });

    const drop = document.getElementById('fbarStmtDrop');
    drop?.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag-over'); });
    drop?.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
    drop?.addEventListener('drop', e => {
      e.preventDefault(); drop.classList.remove('drag-over');
      addFbarFiles(Array.from(e.dataTransfer.files));
    });

    document.querySelectorAll('[data-rmfile]').forEach(btn => {
      btn.addEventListener('click', () => {
        fbarFiles = fbarFiles.filter(f => f.name !== btn.dataset.rmfile);
        render();
      });
    });

    document.querySelectorAll('.match-override').forEach(inp => {
      inp.addEventListener('change', () => {
        const mid = inp.dataset.mid;
        const val = parseFloat(inp.value);
        const acct = fb.accounts.find(a => a.id === mid);
        if (acct) { acct.newMax = isNaN(val) ? null : val; acct.newYearEnd = acct.newMax; acct.matchStatus = 'manual'; }
      });
    });

    document.getElementById('fbarRunMatch')?.addEventListener('click', () => runFbarMatch());
  }

  // ── Export step ──
  if (fb.step === 'export') {
    document.getElementById('fbarExportBack')?.addEventListener('click', () => { fb.step='match'; render(); });
    document.getElementById('fbarDownloadPDF')?.addEventListener('click', () => downloadFbarPDF());
    document.getElementById('fbarReset')?.addEventListener('click', () => {
      if (!confirm('Reset FBAR data and start over?')) return;
      fbarFiles = [];
      S.fbar = { step:'setup', year:S.year, filerName:fb.filerName, accounts:[], fileTexts:[], fxRate:null, matchLog:[], matchDone:false };
      render();
    });
  }
}

// Import accounts from a summary file (XLS/XLSX/CSV/PDF) into S.fbar.accounts.
// Returns the number of accounts added.
async function importAccountsFromFile(file) {
  const fb = S.fbar;
  const name = file.name.toLowerCase();

  // ── Image: OCR via Tesseract.js ─────────────────────────────────────────
  if (/\.(png|jpe?g|webp|gif|bmp|tiff?)$/i.test(name)) {
    if (typeof Tesseract === 'undefined') throw new Error('OCR library not loaded — try refreshing the page');
    fb._importMsg = 'Starting OCR…'; render();
    const { data: { text } } = await Tesseract.recognize(file, 'eng', {
      logger: m => {
        if (m.status === 'loading tesseract core') { fb._importMsg = 'Loading OCR engine…'; render(); }
        else if (m.status === 'loading language traineddata') { fb._importMsg = 'Downloading language data (first time only)…'; render(); }
        else if (m.status === 'recognizing text') { fb._importMsg = `Recognizing text… ${Math.round((m.progress||0)*100)}%`; render(); }
      }
    });
    fb._importMsg = null;
    const accts = parseFbarTextAccounts(text);
    accts.forEach((a, i) => fb.accounts.push({
      id: String(Date.now()) + i, name: a.name || '', number: a.number || '',
      type: a.type || 'bank', ownership: 'sole', include: true, source: 'manual',
      priorMax: a.priorMax || null, priorYearEnd: null,
      newMax: null, newYearEnd: null, matchFile: null, matchStatus: 'pending',
    }));
    return accts.length;
  }

  // ── XLS / XLSX / CSV: structured column import ──────────────────────────
  if (name.endsWith('.xls') || name.endsWith('.xlsx') || name.endsWith('.csv')) {
    let rows;
    if (name.endsWith('.csv')) {
      const text = await file.text();
      rows = text.split(/\r?\n/).map(l => l.split(',').map(c => c.trim().replace(/^"|"$/g, '')));
    } else {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type:'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
    }
    if (rows.length < 2) return 0;

    // Detect column indices from header row
    const hdr = rows[0].map(h => String(h).toLowerCase());
    const col = (patterns) => hdr.findIndex(h => patterns.some(p => h.includes(p)));
    const ci = {
      name:      col(['institution','bank','financial','name','entity']),
      number:    col(['account no','account num','acct no','acct num','account #','acct #','number']),
      type:      col(['type','category']),
      ownership: col(['ownership','owner','joint']),
      max:       col(['max','balance','value','usd','amount']),
    };
    if (ci.name === -1) return 0; // can't identify institution column

    const TYPE_NORM = { bank:'bank', deposit:'bank', savings:'bank', checking:'bank',
      brokerage:'brokerage', securities:'brokerage', demat:'brokerage', equity:'brokerage',
      'mutual fund':'mf', mf:'mf', fund:'mf', other:'other' };
    let added = 0;
    for (let r = 1; r < rows.length; r++) {
      const row = rows[r];
      const instName = ci.name >= 0 ? String(row[ci.name] || '').trim() : '';
      if (!instName) continue;
      const num     = ci.number    >= 0 ? String(row[ci.number]    || '').trim() : '';
      const typeRaw = ci.type      >= 0 ? String(row[ci.type]      || '').toLowerCase().trim() : '';
      const ownRaw  = ci.ownership >= 0 ? String(row[ci.ownership] || '').toLowerCase().trim() : '';
      const maxRaw  = ci.max       >= 0 ? parseFloat(String(row[ci.max] || '').replace(/[,$₹\s]/g,'')) : null;
      const accType = TYPE_NORM[typeRaw] || (typeRaw ? 'other' : 'bank');
      const ownership = ownRaw.includes('joint') ? 'joint' : ownRaw.includes('sig') ? 'sigauth' : 'sole';
      const digits = num.replace(/\D/g, '');
      const last4  = digits.length >= 4 ? `****${digits.slice(-4)}` : (num || '');
      fb.accounts.push({
        id: String(Date.now()) + r, name: instName, number: last4,
        type: accType, ownership, include: true, source: 'manual',
        priorMax: isNaN(maxRaw) ? null : maxRaw, priorYearEnd: isNaN(maxRaw) ? null : maxRaw,
        newMax: null, newYearEnd: null, matchFile: null, matchStatus: 'pending',
      });
      added++;
    }
    return added;
  }

  // ── PDF: use text extraction + parseFbarTextAccounts ────────────────────
  const text = await extractTextFromFile(file);
  // First try XFA (in case it's another FBAR PDF)
  const xfaAccts = tryParseXFAAccounts(text);
  if (xfaAccts.length > 0) {
    xfaAccts.forEach((a, i) => fb.accounts.push({
      id: String(Date.now()) + i, name: a.institution_name || '', number: a.account_number || '',
      type: a.account_type || 'bank', ownership: a.ownership || 'sole', include: true, source: 'manual',
      priorMax: a.max_value_usd || null, priorYearEnd: a.year_end_value_usd || null,
      newMax: null, newYearEnd: null, matchFile: null, matchStatus: 'pending',
    }));
    return xfaAccts.length;
  }
  // Fallback: text-based parser
  const textAccts = parseFbarTextAccounts(text);
  textAccts.forEach((a, i) => fb.accounts.push({
    id: String(Date.now()) + i, name: a.name || '', number: a.number || '',
    type: a.type || 'bank', ownership: 'sole', include: true, source: 'manual',
    priorMax: a.priorMax || null, priorYearEnd: null,
    newMax: null, newYearEnd: null, matchFile: null, matchStatus: 'pending',
  }));
  return textAccts.length;
}

function addFbarFiles(newFiles) {
  const valid = newFiles.filter(f => /\.(pdf|xls|xlsx|csv)$/i.test(f.name));
  if (!valid.length) return;
  const names = new Set(fbarFiles.map(f=>f.name));
  fbarFiles = [...fbarFiles, ...valid.filter(f=>!names.has(f.name))];
  S.fbar.matchDone = false;
  render();
}

async function runFbarMatch() {
  const fb = S.fbar;
  if (!fbarFiles.length) return;
  fb.matchLog = ['Extracting text from files…'];
  fb.matchDone = false;
  render();

  // Fetch FX rate if needed
  if (!fb.fxRate) {
    try {
      const r = await fetch(`${FBAR_WORKER}/api/fx?year=${fb.year}`);
      if (r.ok) { const d = await r.json(); fb.fxRate = d.rate; }
    } catch(_) {}
    if (!fb.fxRate) fb.fxRate = 84.07; // fallback
  }

  // Extract text
  const fileTexts = [];
  for (const file of fbarFiles) {
    try {
      const text = await extractTextFromFile(file);
      fileTexts.push({ filename:file.name, text });
      fb.matchLog.push(`  ✓ ${file.name}  (${text.length.toLocaleString()} chars)`);
    } catch(e) { fb.matchLog.push(`  ✗ ${file.name}: ${e.message}`); }
    render();
  }

  if (!fileTexts.length) {
    fb.matchLog.push('✗ Could not read any files.'); fb.matchDone = true; render(); return;
  }

  fb.matchLog.push(`\nMatching ${fb.accounts.filter(a=>a.include).length} accounts…`);
  render();

  // Local client-side matching
  for (const acct of fb.accounts) {
    if (!acct.include) continue;
    let bestMax = 0, bestYE = 0, bestFile = null;
    for (const { filename, text } of fileTexts) {
      const result = findAccountInText(acct.name, text);
      if (!result) continue;
      if (result.peakBalance > bestMax) {
        bestMax = result.peakBalance;
        bestYE = result.yearEndBalance || result.peakBalance;
        bestFile = filename;
      }
    }
    if (bestMax > 0 && fb.fxRate) {
      acct.newMax = Math.round(bestMax / fb.fxRate);
      acct.newYearEnd = Math.round(bestYE / fb.fxRate);
      acct.matchFile = bestFile;
      acct.matchStatus = 'matched';
      fb.matchLog.push(`  ✓ ${acct.name} — ${fmtINR(bestMax)} → ${fmtUSD(acct.newMax)}`);
    } else {
      acct.matchStatus = 'pending';
      fb.matchLog.push(`  · ${acct.name} — not found`);
    }
  }

  fb.matchLog.push('\nDone. Override any values in the table below.');
  fb.matchDone = true;
  render();
}

function downloadFbarPDF() {
  const fb = S.fbar;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  let y = 18;
  const included = fb.accounts.filter(a=>a.include);
  const totalMax = included.reduce((s,a)=>(s+(a.newMax||0)),0);
  const totalYE  = included.reduce((s,a)=>(s+(a.newYearEnd||a.newMax||0)),0);
  const rate = fb.fxRate || 84;

  doc.setFontSize(14); doc.setFont(undefined,'bold');
  doc.text('FinCEN Form 114 — FBAR Reference Summary', pageW/2, y, {align:'center'});
  y += 7;
  doc.setFontSize(9); doc.setFont(undefined,'normal'); doc.setTextColor(100);
  doc.text('Reference summary for BSA e-filing. Not the official FinCEN form.', pageW/2, y, {align:'center'});
  doc.setTextColor(0); y += 8;

  doc.setFontSize(10); doc.setFont(undefined,'bold');
  doc.text('Part I — Filer Information', 14, y); y += 5;
  doc.setFont(undefined,'normal'); doc.setFontSize(9);
  [
    ['Calendar year', String(fb.year)],
    ['Filer name', fb.filerName || '—'],
    ['Exchange rate (Dec 31)', `₹${rate.toFixed(2)} per USD`],
    ['Accounts reported', String(included.length)],
    ['Total maximum value (USD)', '$'+Math.round(totalMax).toLocaleString()],
    ['Total year-end value (USD)', '$'+Math.round(totalYE).toLocaleString()],
  ].forEach(([l,v]) => {
    doc.setTextColor(100); doc.text(l, 14, y);
    doc.setTextColor(0); doc.text(v, 90, y); y += 5;
  });
  y += 4;

  doc.setFontSize(10); doc.setFont(undefined,'bold');
  doc.text('Part V — Foreign Financial Accounts', 14, y); y += 4;
  doc.autoTable({
    startY: y,
    head: [['#','Institution','Acct #','Type','Ownership','Max (USD)','Year-End (USD)']],
    body: included.map((a,i) => [
      i+1, a.name, a.number||'—', FBAR_TYPE_LABELS[a.type]||a.type,
      a.ownership==='joint'?'Joint':'Sole',
      a.newMax!=null?'$'+Math.round(a.newMax).toLocaleString():'MISSING',
      a.newYearEnd!=null?'$'+Math.round(a.newYearEnd).toLocaleString():'MISSING',
    ]),
    styles: { fontSize:8, cellPadding:2 },
    headStyles: { fillColor:[30,30,28], fontSize:8 },
    margin: { left:14, right:14 },
    didParseCell: d => {
      if (d.section==='body' && (d.column.index===5||d.column.index===6))
        if (d.cell.raw==='MISSING') d.cell.styles.textColor=[180,30,30];
    },
  });
  y = doc.lastAutoTable.finalY + 8;
  doc.setFontSize(8); doc.setTextColor(120);
  doc.text('Family Tax Planner · jawadayaz.github.io/tax-planner · '+new Date().toLocaleDateString(), 14, y);
  doc.save(`FBAR_${fb.year}_reference.pdf`);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
function silentDriveAuth() {
  // Called once GIS library is ready — silently gets a token if user previously authorized
  if (S.driveToken) return; // already have a valid cached token
  if (typeof google === 'undefined' || !google.accounts?.oauth2) return;
  try {
    google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/drive.readonly',
      prompt: '',  // no popup — silent only
      callback: r => {
        if (r.error || !r.access_token) return; // silently fail
        S.driveToken = r.access_token;
        const exp = Date.now() + (r.expires_in ? (r.expires_in - 300) * 1000 : 55 * 60 * 1000);
        localStorage.setItem('tp_drive', JSON.stringify({token: r.access_token, exp}));
        render();
      },
      error_callback: () => {} // silent — user will click Connect if needed
    }).requestAccessToken({ prompt: '' });
  } catch { /* silent */ }
}

(function init() {
  const sel = document.getElementById('yearSelect');
  YEARS.forEach(y => {
    const o = document.createElement('option');
    o.value = y; o.textContent = y + (y===CURRENT_YEAR ? ' ◂ current' : '');
    sel.appendChild(o);
  });
  sel.value = S.year;
  loadAll();
  navigate('dashboard');
  // Attempt silent Drive auth after GIS loads (100ms poll, give up after 5s)
  if (!S.driveToken) {
    let attempts = 0;
    const tryAuth = setInterval(() => {
      attempts++;
      if (S.driveToken || attempts > 50) { clearInterval(tryAuth); return; }
      if (typeof google !== 'undefined' && google.accounts?.oauth2) {
        clearInterval(tryAuth);
        silentDriveAuth();
      }
    }, 100);
  }
})();
