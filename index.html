async function parseSummaryFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  const rows = [];
  if (ext === 'csv' || ext === 'xls' || ext === 'xlsx') {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const data = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
    if (data.length < 2) return rows;
    // Find header row (first row with >2 non-empty cells)
    let hdrIdx = 0;
    for (let r = 0; r < Math.min(5, data.length); r++) {
      if (data[r].filter(c => String(c).trim()).length > 2) { hdrIdx = r; break; }
    }
    const hdrs = data[hdrIdx].map(h => String(h).toLowerCase());
    // Detect columns
    const col = keys => { for (const k of keys) { const i = hdrs.findIndex(h => h.includes(k)); if (i>=0) return i; } return -1; };
    const ci = {
      name:      col(['institution','bank name','account name','name']),
      number:    col(['acct number','acct no','account number','account#','acct#','number']),
      type:      col(['account type','type','category']),
      ownership: col(['ownership','owner','joint']),
      balance:   col(['max balance','balance','value','amount','usd','nav','current value']),
      password:  col(['password','pwd','pass','pdf password','statement password']),
    };
    // Extract FX rate from headers if present (e.g. "inr/usd rate=₹89.8")
    let csvRate = null;
    for (const h of hdrs) {
      const m = h.match(/rate[=:]\s*[₹rs]*\s*([\d.]+)/);
      if (m) { csvRate = parseFloat(m[1]); break; }
    }
    const useRate = csvRate || S.fbar.fxRate || 84;
    for (let r = hdrIdx + 1; r < data.length; r++) {
      const row = data[r];
      if (row.every(c => !String(c).trim())) continue; // skip empty rows
      const name = ci.name >= 0 ? String(row[ci.name] || '').trim() : '';
      if (!name || name.length < 2) continue;
      const numStr = ci.balance >= 0 ? String(row[ci.balance] || '').replace(/[,₹$\s]/g,'') : '';
      let balUSD = null;
      if (numStr) {
        const n = parseFloat(numStr);
        if (!isNaN(n) && n > 0) {
          // Heuristic: if > 500 * rate, assume INR
          balUSD = n > 500 * useRate ? Math.round(n / useRate) : Math.round(n);
        }
      }
      const rawType = ci.type >= 0 ? String(row[ci.type] || '').toLowerCase() : '';
      const type = rawType.includes('broker') || rawType.includes('demat') ? 'brokerage'
                 : rawType.includes('mutual') || rawType.includes('mf') ? 'mf'
                 : rawType.includes('bank') ? 'bank' : 'bank';
      const rawOwn = ci.ownership >= 0 ? String(row[ci.ownership] || '').toLowerCase() : '';
      const ownership = rawOwn.includes('joint') ? 'joint' : rawOwn.includes('sig') ? 'sigauth' : 'sole';
      const number = ci.number >= 0 ? String(row[ci.number] || '').trim() : '';
      const password = ci.password >= 0 ? String(row[ci.password] || '').trim() : '';
      rows.push({ name, number, type, ownership, balUSD, password });
    }
    // Store all non-empty passwords in fbar state for use when opening PDFs
    const passwords = rows.map(r => r.password).filter(p => p && p.length > 0);
    if (passwords.length > 0) {
      S.fbar.pdfPasswords = [...new Set(passwords)];
    }
    // Also extract FX rate and store it
    if (csvRate && !S.fbar.fxRate) { S.fbar.fxRate = csvRate; }
  }
  return rows;
}

async function parseSummaryFileRich(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  const rows = [];
  const passwordMap = {};
  if (ext === 'csv' || ext === 'xls' || ext === 'xlsx') {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const data = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
    if (data.length < 2) return { rows, passwordMap };
    // Find header row (first row with >2 non-empty cells)
    let hdrIdx = 0;
    for (let r = 0; r < Math.min(5, data.length); r++) {
      if (data[r].filter(c => String(c).trim()).length > 2) { hdrIdx = r; break; }
    }
    const hdrs = data[hdrIdx].map(h => String(h).toLowerCase());
    const col = keys => { for (const k of keys) { const i = hdrs.findIndex(h => h.includes(k)); if (i>=0) return i; } return -1; };
    // Balance column: look for 2025 inr/usd, usd, balance, value, amount, or nav
    const ci = {
      name:      col(['institution','bank name','account name','name']),
      number:    col(['acct number','acct no','account number','account#','acct#','number']),
      type:      col(['account type','type','category']),
      ownership: col(['ownership','owner','joint']),
      balance:   (function() {
        // Priority order
        const checks = [
          h => /2025\s*inr[\s/]*usd/.test(h),
          h => h.includes('usd'),
          h => h.includes('balance'),
          h => h.includes('value'),
          h => h.includes('amount'),
          h => h.includes('nav'),
        ];
        for (const check of checks) {
          const i = hdrs.findIndex(check);
          if (i >= 0) return i;
        }
        return -1;
      })(),
      password:  col(['password','pwd','pass','pdf password','statement password']),
    };
    // Extract FX rate from headers if present
    let csvRate = null;
    for (const h of hdrs) {
      const m = h.match(/rate[=:]\s*[₹rs]*\s*([\d.]+)/);
      if (m) { csvRate = parseFloat(m[1]); break; }
    }
    if (csvRate && !S.fbar.fxRate) S.fbar.fxRate = csvRate;
    const useRate = csvRate || S.fbar.fxRate || 84;
    for (let r = hdrIdx + 1; r < data.length; r++) {
      const row = data[r];
      if (row.every(c => !String(c).trim())) continue;
      const name = ci.name >= 0 ? String(row[ci.name] || '').trim() : '';
      if (!name || name.length < 2) continue;
      const numStr = ci.balance >= 0 ? String(row[ci.balance] || '').replace(/[,₹$\s]/g,'') : '';
      let balUSD = null;
      if (numStr) {
        const n = parseFloat(numStr);
        if (!isNaN(n) && n > 0) {
          balUSD = n > 500 * useRate ? Math.round(n / useRate) : Math.round(n);
        }
      }
      const rawType = ci.type >= 0 ? String(row[ci.type] || '').toLowerCase() : '';
      const type = rawType.includes('broker') || rawType.includes('demat') ? 'brokerage'
                 : rawType.includes('mutual') || rawType.includes('mf') ? 'mf'
                 : 'bank';
      const rawOwn = ci.ownership >= 0 ? String(row[ci.ownership] || '').toLowerCase() : '';
      const ownership = rawOwn.includes('joint') ? 'joint' : rawOwn.includes('sig') ? 'sigauth' : 'sole';
      const number = ci.number >= 0 ? String(row[ci.number] || '').trim() : '';
      const password = ci.password >= 0 ? String(row[ci.password] || '').trim() : '';
      // Extract suffix from account number
      const numDigits = number.replace(/\D/g,'');
      const suffix = numDigits.length >= 4 ? numDigits.slice(-4) : '';
      // Build passwordMap keyed by suffix
      if (suffix && password) {
        if (!passwordMap[suffix]) passwordMap[suffix] = [];
        if (!passwordMap[suffix].includes(password)) passwordMap[suffix].push(password);
      }
      rows.push({ name, number, suffix, type, ownership, balUSD, password });
    }
  }
  return { rows, passwordMap };
}

function extractInstitutionFromText(text) {
  const lines = text.split('\n').slice(0, 20);
  for (const line of lines) {
    const l = line.trim();
    if (l.length <= 4) continue;
    if (/^\d/.test(l)) continue;
    if (/statement|account/i.test(l)) continue;
    return l;
  }
  return '';
}

function wordOverlap(a, b) {
  if (!a || !b) return 0;
  const norm = s => String(s).toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
  const wa = norm(a).split(' ').filter(w => w.length > 2);
  const wb = new Set(norm(b).split(' ').filter(w => w.length > 2));
  if (!wa.length || !wb.size) return 0;
  return wa.filter(w => wb.has(w)).length / Math.max(wa.length, wb.size);
}

function findBestAccountMatch(name, accounts, number) {
  // Prefer exact account number match when available
  if (number) {
    const numDigits = String(number).replace(/[^0-9]/g,'');
    if (numDigits.length >= 4) {
      const byNum = accounts.find(a => {
        const aDigits = (a.number || '').replace(/[^0-9]/g,'');
        return aDigits.length >= 4 && aDigits.slice(-4) === numDigits.slice(-4);
      });
      if (byNum) return { acct: byNum, score: 1.0 };
    }
  }
  // Fall back to name similarity
  let best = null, bestScore = 0;
  for (const acct of accounts) {
    const s = wordOverlap(name, acct.name);
    if (s > bestScore) { bestScore = s; best = acct; }
  }
  return bestScore >= 0.4 ? { acct: best, score: bestScore } : null;
}

async function runMatch() {
  const fb = S.fbar;
  fb.matchLog = [];
  fb.matchRan = false;
  fb.flags = [];

  if (fbarFileObjects.length === 0) {
    fb.matchLog.push('No files loaded — please upload files first.');
    fb.matchRan = true;
    saveFbarData(); render(); return;
  }

  // Split file objects by type
  const prevFbarObjs   = fbarFileObjects.filter((_, i) => fb.files[i]?.fileType === 'prev_fbar');
  const prevFbarMeta   = fb.files.map((f, i) => f.fileType === 'prev_fbar' ? i : -1).filter(i => i >= 0);
  const summaryObjs    = fbarFileObjects.filter((_, i) => fb.files[i]?.fileType === 'summary');
  const statementObjs  = fbarFileObjects.filter((_, i) => fb.files[i]?.fileType === 'statement');
  const statementMeta  = fb.files.map((f, i) => f.fileType === 'statement' ? i : -1).filter(i => i >= 0);

  // ── Step 1: extract accounts from prev FBAR (rich) ──
  let baseAccounts = fb.accounts.filter(a => a.status === 'manual').map(a => ({...a}));
  fb.matchLog.push('Step 1 — Parsing prev year FBAR(s)…');
  render();

  let filerInfoSet = false;
  for (let pi = 0; pi < prevFbarObjs.length; pi++) {
    const file = prevFbarObjs[pi];
    try {
      fb.matchLog.push('  Reading ' + file.name + '…'); render();
      const text = await extractTextFromFile(file);
      // Parse filer info from first FBAR only
      if (!filerInfoSet) {
        const fi = parseFilerInfoXFA(text);
        if (fi) { fb.filerInfo = fi; filerInfoSet = true; }
      }
      // Use rich parse for full fields
      const richParsed = tryParseXFAAccountsRich(text);
      const parsed = richParsed.length > 0 ? richParsed : (tryParseXFAAccounts(text).length > 0 ? tryParseXFAAccounts(text).map(p => ({...p, block_type:'FinAcctOwnedSeparately', acct_type_code:'B', suffix:'', addr:'', city:'', state:'', zip:'', country:'', n_joint_owners:'', joint_tin:'', joint_tin_type:'', joint_last:'', joint_first:'', joint_country:''})) : parseFbarTextAccounts(text).map(p => ({...p, block_type:'FinAcctOwnedSeparately', acct_type_code:'B', suffix:'', addr:'', city:'', state:'', zip:'', country:'', n_joint_owners:'', joint_tin:'', joint_tin_type:'', joint_last:'', joint_first:'', joint_country:''})));
      fb.matchLog.push('  Found ' + parsed.length + ' account(s)');
      for (const p of parsed) {
        if (!p.name || String(p.name).trim().length < 2) continue;
        const pSuffix = p.suffix || (p.number || '').replace(/[^0-9]/g,'').slice(-4);
        const exists = baseAccounts.find(a => {
          const aSuffix = a.suffix || (a.number || '').replace(/[^0-9]/g,'').slice(-4);
          if (pSuffix.length >= 4 && aSuffix.length >= 4) {
            return pSuffix === aSuffix;
          }
          return wordOverlap(p.name, a.name) >= 0.6 && !pSuffix && !aSuffix;
        });
        if (!exists) {
          baseAccounts.push({
            id: Math.random().toString(36).slice(2,8),
            name: String(p.name).trim(),
            type: p.type || 'bank',
            number: p.number || '',
            suffix: pSuffix,
            ownership: p.ownership || 'sole',
            block_type: p.block_type || 'FinAcctOwnedSeparately',
            acct_type_code: p.acct_type_code || 'B',
            other_desc: p.other_desc || '',
            addr: p.addr || '', city: p.city || '', state: p.state || '', zip: p.zip || '', country: p.country || '',
            n_joint_owners: p.n_joint_owners || '', joint_tin: p.joint_tin || '', joint_tin_type: p.joint_tin_type || '',
            joint_last: p.joint_last || '', joint_first: p.joint_first || '', joint_country: p.joint_country || '',
            prevMax: p.max_value_usd || null,
            newMax: null, status: 'needs_update', source: null, include: true,
          });
        }
      }
    } catch(e) { fb.matchLog.push('  Error: ' + e.message); }
  }
  fb.matchLog.push('  Total after FBAR parse: ' + baseAccounts.length + ' account(s)');

  // ── Step 2: match with summary (CSV — priority 2, can be overridden by statement) ──
  fb.matchLog.push('\nStep 2 — Matching with summary file(s)…');
  render();

  for (const file of summaryObjs) {
    try {
      fb.matchLog.push('  Reading ' + file.name + '…'); render();
      const { rows, passwordMap } = await parseSummaryFileRich(file);
      // Merge passwordMap into fb.passwordMap
      for (const [sfx, pwds] of Object.entries(passwordMap)) {
        if (!fb.passwordMap[sfx]) fb.passwordMap[sfx] = [];
        for (const pwd of pwds) { if (!fb.passwordMap[sfx].includes(pwd)) fb.passwordMap[sfx].push(pwd); }
      }
      // Collect all passwords into fb.pdfPasswords
      const allPwds = Object.values(passwordMap).flat();
      for (const pwd of allPwds) { if (pwd && !fb.pdfPasswords.includes(pwd)) fb.pdfPasswords.push(pwd); }
      fb.matchLog.push('  Found ' + rows.length + ' row(s) in summary');
      let matched = 0, added = 0;
      for (const row of rows) {
        if (!row.name) continue;
        // Match by suffix first, then name
        const m = findBestAccountMatch(row.name, baseAccounts, row.number);
        if (m) {
          // Only set newMax from CSV if newMax is currently null (statement will override later)
          if (m.acct.newMax == null) {
            m.acct.newMax = row.balUSD;
            m.acct.status = 'matched';
            m.acct.source = 'csv';
          }
          if (row.number && !m.acct.number) m.acct.number = row.number;
          if (row.suffix && !m.acct.suffix) m.acct.suffix = row.suffix;
          if (row.type) m.acct.type = row.type;
          fb.matchLog.push('  ✓ ' + row.name + (row.balUSD ? ' → ' + fmtUSD(row.balUSD) : ''));
          matched++;
        } else {
          const ownership = row.ownership || 'sole';
          baseAccounts.push({
            id: Math.random().toString(36).slice(2,8),
            name: row.name, type: row.type || 'bank', number: row.number || '',
            suffix: row.suffix || '',
            ownership,
            block_type: ownership === 'joint' ? 'FinAcctOwnedJointly' : 'FinAcctOwnedSeparately',
            acct_type_code: row.type === 'brokerage' ? 'S' : row.type === 'mf' ? 'M' : 'B',
            other_desc: '', addr: '', city: '', state: '', zip: '', country: '',
            n_joint_owners: '', joint_tin: '', joint_tin_type: '', joint_last: '', joint_first: '', joint_country: '',
            prevMax: null, newMax: row.balUSD,
            status: 'new', source: 'csv', include: true,
          });
          fb.matchLog.push('  + New: ' + row.name + (row.balUSD ? ' ' + fmtUSD(row.balUSD) : ''));
          added++;
        }
      }
      fb.matchLog.push('  Summary: ' + matched + ' matched, ' + added + ' new, ' + baseAccounts.filter(a=>a.status==='needs_update').length + ' needs update');
    } catch(e) { fb.matchLog.push('  Error: ' + e.message); }
  }

  // ── Step 3: process statements (priority 1 — overrides CSV) ──
  const allKnownSuffixes = new Set(baseAccounts.map(a => a.suffix).filter(s => s && s.length === 4));
  const newAcctsFromStmts = [];

  if (statementObjs.length > 0) {
    fb.matchLog.push('\nStep 3 — Processing statement(s)…');
    render();
  }

  for (let si = 0; si < statementObjs.length; si++) {
    const file = statementObjs[si];
    const metaIdx = statementMeta[si];
    fb.matchLog.push('  ' + file.name + '…'); render();
    try {
      let text = '';
      let isProtected = false;
      const ext = file.name.split('.').pop().toLowerCase();

      // Detect filename suffix
      const fnM = file.name.match(/[X*]{4,}(\d{4})/i);
      const filenameSuffix = fnM ? fnM[1] : null;

      // Build passwords to try: suffix-specific first, then all known passwords
      const passwordsToTry = [];
      if (filenameSuffix && fb.passwordMap[filenameSuffix]) {
        for (const p of fb.passwordMap[filenameSuffix]) { if (!passwordsToTry.includes(p)) passwordsToTry.push(p); }
      }
      for (const p of (fb.pdfPasswords || [])) { if (!passwordsToTry.includes(p)) passwordsToTry.push(p); }

      if (['png','jpg','jpeg','webp','gif'].includes(ext)) {
        if (typeof Tesseract === 'undefined') throw new Error('OCR not loaded');
        const result = await Tesseract.recognize(file, 'eng', {
          logger: m => { if (m.status === 'recognizing text') { fb.matchLog[fb.matchLog.length-1] = '  ' + file.name + '… OCR ' + Math.round((m.progress||0)*100) + '%'; render(); } }
        });
        text = result.data.text;
      } else {
        // Try with no password first
        try {
          extractTextFromFile._pwd = '';
          text = await extractTextFromFile(file);
        } catch(pwdErr) {
          const isPwdErr = pwdErr.message?.toLowerCase().includes('password') || pwdErr.name === 'PasswordException' || pwdErr.code === 1;
          if (isPwdErr) {
            isProtected = true;
            let opened = false;
            for (const pwd of passwordsToTry) {
              try {
                extractTextFromFile._pwd = pwd;
                text = await extractTextFromFile(file);
                fb.matchLog.push('    (unlocked with password)');
                opened = true; break;
              } catch { /* try next */ }
            }
            if (!opened) {
              // Flag the file
              const hasCsvEntry = filenameSuffix && allKnownSuffixes.has(filenameSuffix);
              const csvHasPassword = filenameSuffix && fb.passwordMap[filenameSuffix] && fb.passwordMap[filenameSuffix].length > 0;
              let reason;
              if (!hasCsvEntry) reason = 'PASSWORD PROTECTED — no matching CSV entry';
              else if (!csvHasPassword) reason = 'PASSWORD PROTECTED — CSV entry exists but password column is blank';
              else reason = 'PASSWORD PROTECTED — wrong password';
              fb.flags.push({ type: 'password_protected', suffix: filenameSuffix, file: file.name, reason });
              if (metaIdx >= 0) fb.files[metaIdx].flag = reason;
              fb.matchLog.push('    ⚠ ' + reason);
              continue;
            }
          } else { throw pwdErr; }
        }
      }

      let fileMatched = false;
      const rate = fb.fxRate || 84;

      // Extract suffix from text if not in filename
      const textAcctSuffix = filenameSuffix ? null : extractAccountSuffixFromText(text);
      const acctSuffix = filenameSuffix || textAcctSuffix;
      const suffixSource = filenameSuffix ? 'filename' : textAcctSuffix ? 'header' : null;

      const acctByNumber = acctSuffix
        ? baseAccounts.find(a => {
            const aSuffix = a.suffix || (a.number || '').replace(/[^0-9]/g,'').slice(-4);
            return aSuffix === acctSuffix;
          })
        : null;

      if (acctByNumber) {
        // Targeted single-account extraction — statement overrides everything
        const labeled = extractLabeledAmounts(text).map(l => l.value).sort((a,b) => b-a);
        const allAmts = extractCurrencyAmounts(text).concat(extractAmounts(text)).sort((a,b) => b-a);
        const peakBalance = labeled[0] || allAmts[0] || 0;
        if (peakBalance > 0) {
          const usdVal = Math.round(peakBalance / rate);
          // Statement overrides regardless of current value
          acctByNumber.newMax = usdVal;
          acctByNumber.source = 'statement';
          if (acctByNumber.status === 'needs_update') acctByNumber.status = 'matched';
          fb.matchLog.push('    ✓ [' + suffixSource + ':****' + acctSuffix + '] ' + acctByNumber.name + ' — ' + fmtINR(peakBalance) + ' → ' + fmtUSD(usdVal));
          fileMatched = true;
        } else {
          fb.matchLog.push('    ? [' + suffixSource + ':****' + acctSuffix + '] ' + acctByNumber.name + ' — no balance found in ' + fb.year);
        }
      } else {
        // Suffix found but not in any account — track for new account
        if (acctSuffix && !allKnownSuffixes.has(acctSuffix)) {
          const labeled = extractLabeledAmounts(text).map(l => l.value).sort((a,b) => b-a);
          const allAmts = extractCurrencyAmounts(text).concat(extractAmounts(text)).sort((a,b) => b-a);
          const peakBalance = labeled[0] || allAmts[0] || 0;
          if (!isProtected && peakBalance > 0) {
            const usdVal = Math.round(peakBalance / rate);
            const existsInNew = newAcctsFromStmts.find(a => a.suffix === acctSuffix);
            if (!existsInNew) {
              const instName = extractInstitutionFromText(text);
              newAcctsFromStmts.push({
                id: Math.random().toString(36).slice(2,8),
                name: instName || ('Account ****' + acctSuffix),
                suffix: acctSuffix,
                number: '****' + acctSuffix,
                type: 'bank', ownership: 'sole',
                block_type: 'FinAcctOwnedSeparately',
                acct_type_code: 'B',
                country: 'IN',
                other_desc: '', addr: '', city: '', state: '', zip: '',
                n_joint_owners: '', joint_tin: '', joint_tin_type: '', joint_last: '', joint_first: '', joint_country: '',
                prevMax: null, newMax: usdVal,
                status: 'new', source: 'statement (new)', include: true,
              });
              fb.matchLog.push('    + New from statement: ****' + acctSuffix + ' — ' + fmtUSD(usdVal));
              fileMatched = true;
            }
          }
        }
        if (!fileMatched) {
          // Fallback to name-based search
          if (acctSuffix) fb.matchLog.push('    ? suffix ****' + acctSuffix + ' not matched to any known account — falling back to name search');
          for (const acct of baseAccounts) {
            const result = findAccountInText(acct.name, text);
            if (result && result.peakBalance > 0) {
              const usdVal = Math.round(result.peakBalance / rate);
              // Statement overrides
              acct.newMax = usdVal;
              acct.source = 'statement';
              if (acct.status === 'needs_update') acct.status = 'matched';
              fb.matchLog.push('    ✓ [name] ' + acct.name + ' — ' + fmtINR(result.peakBalance) + ' → ' + fmtUSD(usdVal));
              fileMatched = true;
            }
          }
        }
      }
      if (metaIdx >= 0) fb.files[metaIdx].matched = fileMatched;
      if (!fileMatched) fb.matchLog.push('    (no matching accounts found)');
    } catch(e) { fb.matchLog.push('  Error: ' + e.message); }
  }

  // Add new accounts discovered from statements (if suffix not already present)
  for (const na of newAcctsFromStmts) {
    if (!baseAccounts.find(a => (a.suffix || '') === na.suffix)) {
      baseAccounts.push(na);
    }
  }

  fb.accounts = baseAccounts;
  fb.matchRan = true;
  saveFbarData();
  render();
}

function attachFbarListeners() {
  const fb = S.fbar;

  // Year selector
  const yearSel = document.getElementById('fbarYearSel');
  if (yearSel) yearSel.addEventListener('change', e => {
    saveFbarData();
    fbarFileObjects = [];
    const newState = loadFbarData(fb.filer, parseInt(e.target.value));
    S.fbar = newState;
    render();
  });

  // FX rate input
  const fxInput = document.getElementById('fbarFxInput');
  if (fxInput) fxInput.addEventListener('change', e => {
    const v = parseFloat(e.target.value);
    if (!isNaN(v) && v > 0) { S.fbar.fxRate = v; saveFbarData(); render(); }
  });

  // Upload drop zone
  const drop = document.getElementById('fbarUploadDrop');
  const inp  = document.getElementById('fbarUploadInput');
  if (drop) {
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.style.background='#eef2ff'; });
    drop.addEventListener('dragleave', () => { drop.style.background=''; });
    drop.addEventListener('drop', e => { e.preventDefault(); drop.style.background=''; addFbarUploadFiles(e.dataTransfer.files); });
  }
  if (inp) inp.addEventListener('change', e => { addFbarUploadFiles(e.target.files); e.target.value=''; });

  // Remove file buttons
  document.querySelectorAll('[data-rmfile]').forEach(btn => {
    btn.addEventListener('click', e => {
      const i = parseInt(e.target.dataset.rmfile);
      fb.files.splice(i, 1);
      fbarFileObjects.splice(i, 1);
      fb.matchRan = false;
      saveFbarData(); render();
    });
  });

  // Add account button
  const addBtn = document.getElementById('fbarAddAcct');
  if (addBtn) addBtn.addEventListener('click', () => {
    fb.accounts.push({ id: Math.random().toString(36).slice(2,8), name:'', type:'bank', number:'', ownership:'sole', prevMax:null, newMax:null, status:'manual', source:'manual', include:true });
    saveFbarData(); render();
  });

  // Account field changes
  document.querySelectorAll('[data-ai]').forEach(el => {
    const update = () => {
      const i = parseInt(el.dataset.ai);
      const f = el.dataset.f;
      if (!fb.accounts[i]) return;
      if (f === 'include') { fb.accounts[i].include = el.checked; }
      else if (f === 'newMax') {
        const rate = fb.fxRate || 84; const cur = fb.balCurrency || 'inr';
        fb.accounts[i].newMax = fromInput(el.value, rate, cur);
        if (fb.accounts[i].newMax != null) fb.accounts[i].source = 'manual';
      }
      else { fb.accounts[i][f] = el.value; }
      saveFbarData();
    };
    el.addEventListener('change', update);
    if (el.tagName === 'INPUT' && el.type === 'text') el.addEventListener('blur', update);
  });

  // Delete account buttons
  document.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', e => {
      const i = parseInt(e.target.dataset.del);
      fb.accounts.splice(i, 1);
      saveFbarData(); render();
    });
  });

  // Move account to Excluded panel
  document.querySelectorAll('[data-moveout]').forEach(btn => {
    btn.addEventListener('click', e => {
      const i = parseInt(e.target.dataset.moveout);
      if (fb.accounts[i]) { fb.accounts[i].include = false; saveFbarData(); render(); }
    });
  });

  // Move account to Included panel
  document.querySelectorAll('[data-movein]').forEach(btn => {
    btn.addEventListener('click', e => {
      const i = parseInt(e.target.dataset.movein);
      if (fb.accounts[i]) { fb.accounts[i].include = true; saveFbarData(); render(); }
    });
  });

  // Run Match button
  const runBtn = document.getElementById('fbarRunMatch');
  if (runBtn) runBtn.addEventListener('click', () => { runMatch(); });

  // Export button
  const expBtn = document.getElementById('fbarExportBtn');
  if (expBtn) expBtn.addEventListener('click', () => { downloadFbarPDF(); });
  const genBtn = document.getElementById('fbarGeneratePdfBtn');
  if (genBtn) genBtn.addEventListener('click', () => { generateRealFbarPdf(); });

  // Folder auto-load buttons
  const selDirBtn = document.getElementById('fbarSelectDir');
  if (selDirBtn) selDirBtn.addEventListener('click', () => fbarSelectDir());
  const relDirBtn = document.getElementById('fbarReloadDir');
  if (relDirBtn) relDirBtn.addEventListener('click', () => fbarReloadDir());
  const chgDirBtn = document.getElementById('fbarChangeDir');
  if (chgDirBtn) chgDirBtn.addEventListener('click', () => { localStorage.removeItem('fbar_dir_name'); fbarSelectDir(); });

  // Auto-load from persisted dir on first visit (silent — only if permission already granted)
  fbarInitDir();
}

function addFbarUploadFiles(fileList) {
  const fb = S.fbar;
  const allowed = ['pdf','csv','xls','xlsx','png','jpg','jpeg','webp','gif'];
  for (const file of fileList) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (!allowed.includes(ext)) continue;
    const fileType = detectFbarFileType(file, fb.year);
    if (fileType === 'current_fbar') {
      if (!fb.currentYearFiles.some(f => f.name === file.name))
        fb.currentYearFiles.push({ name: file.name, fileType: 'current_fbar' });
    } else {
      if (fb.files.some(f => f.name === file.name)) continue; // dedupe
      fb.files.push({ name: file.name, fileType, matched: false });
      fbarFileObjects.push(file);
    }
  }
  fb.matchRan = false;
  saveFbarData(); render();
}

function downloadFbarPDF() {
  const fb = S.fbar;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const rate = fb.fxRate || 84;
  let y = 18;
  const included = fb.accounts.filter(a => a.include !== false);
  const totalMax = included.reduce((s,a) => s + (a.newMax || 0), 0);

  doc.setFontSize(14); doc.setFont(undefined,'bold');
  doc.text('FinCEN Form 114 — FBAR Reference Summary', pageW/2, y, {align:'center'});
  y += 7;
  doc.setFontSize(9); doc.setFont(undefined,'normal'); doc.setTextColor(100);
  doc.text('Reference summary for BSA e-filing. Not the official FinCEN form.', pageW/2, y, {align:'center'});
  doc.setTextColor(0); y += 8;

  doc.setFontSize(10); doc.setFont(undefined,'bold');
  doc.text('Part I — Filer Information', 14, y); y += 5;
  doc.setFont(undefined,'normal'); doc.setFontSize(9);
  [
    ['Calendar year', String(fb.year)],
    ['Filer', FBAR_FILERS.find(f=>f.id===fb.filer)?.label || fb.filer],
    ['Exchange rate (Dec 31)', '\u20b9' + rate.toFixed(2) + ' per USD'],
    ['Accounts reported', String(included.length)],
    ['Total maximum value (USD)', '$' + Math.round(totalMax).toLocaleString()],
  ].forEach(([l,v]) => {
    doc.setTextColor(100); doc.text(l, 14, y);
    doc.setTextColor(0); doc.text(v, 80, y); y += 5;
  });
  y += 4;

  doc.setFontSize(10); doc.setFont(undefined,'bold');
  doc.text('Part V — Foreign Financial Accounts', 14, y); y += 4;
  doc.autoTable({
    startY: y,
    head: [['#','Institution','Acct #','Type','Ownership','Prev Max (USD)','Max Value (USD)','Status']],
    body: included.map((a,i) => [
      i+1, a.name, a.number||'—',
      FBAR_TYPE_LABELS[a.type]||a.type,
      a.ownership==='joint'?'Joint':a.ownership==='sigauth'?'Sig Auth':'Sole',
      a.prevMax!=null ? '$'+Math.round(a.prevMax).toLocaleString() : '—',
      a.newMax!=null  ? '$'+Math.round(a.newMax).toLocaleString()  : 'MISSING',
      a.status || '—',
    ]),
    styles: { fontSize:8 },
    headStyles: { fillColor:[79,70,229] },
    alternateRowStyles: { fillColor:[249,250,251] },
  });
  y = doc.lastAutoTable.finalY + 8;
  doc.setFontSize(8); doc.setTextColor(120);
  doc.text('Family Tax Planner \u00b7 jawadayaz.github.io/tax-planner \u00b7 ' + new Date().toLocaleDateString(), 14, y);
  doc.save('FBAR_' + fb.year + '_' + fb.filer + '_reference.pdf');
  fb.completed = true;
  saveFbarData(); render();
}

// ─── FBAR REAL PDF GENERATION ─────────────────────────────────────────────────
const UCC_NS_ATTR = 'xmlns:ucc="http://www.fincen.gov/bsa/ucommon-components/2011-06-01"';
const FFBAR_NS_ATTRS = 'xmlns:ffbar="http://www.fincen.gov/bsa/ffbar/2011-06-01" xmlns:cc="http://www.fincen.gov/bsa/common-components/2009-01-01" xmlns:est="http://www.fincen.gov/bsa/efile-submission-types/2009-01-01" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"';
function xmlE(tag, val, ns) { ns=ns||'ffbar'; const v=val!=null?String(val).trim():''; return v?`<${ns}:${tag}>${v}</${ns}:${tag}>`:`<${ns}:${tag}/>`; }
function xmlEU(tag, val) { const v=val!=null?String(val).trim():''; return v?`<ucc:${tag} ${UCC_NS_ATTR}>${v}</ucc:${tag}>`:`<ucc:${tag} ${UCC_NS_ATTR}/>`; }
function buildXmlAddr(a,ci,st,z,co) { return `<ffbar:Address>${xmlEU('Address',a)}${xmlEU('City',ci)}${xmlEU('State',st)}${xmlEU('ZIP',z)}${xmlEU('Country',co||'IN')}</ffbar:Address>`; }

function buildAccountBlockXML(acct) {
  const ownership = acct.ownership || 'sole';
  const btype = acct.block_type || (ownership === 'joint' ? 'FinAcctOwnedJointly' : ownership === 'sigauth' ? 'FinAcctSigAuth' : 'FinAcctOwnedSeparately');
  const TYPE_CODE_MAP = { bank:'B', brokerage:'S', mf:'M', other:'Z' };
  const acctTypeCode = acct.acct_type_code || TYPE_CODE_MAP[acct.type] || 'B';
  const cleanNum = (acct.number||'').replace(/^\*+/g,'').replace(/^X+/gi,'').trim() || acct.suffix || '';
  const maxVal = Math.round(acct.newMax||0);
  let xml = xmlE('MaximumAccntValue', maxVal > 0 ? String(maxVal) : '');
  xml += xmlE('MaximumAccntUnkn', '');
  xml += xmlE('AccountType', acctTypeCode);
  if (acctTypeCode === 'Z') xml += xmlE('OtherDesc', acct.other_desc || acct.type || '');
  else xml += xmlE('OtherDesc', '');
  xml += xmlE('FinInstName', acct.name || '');
  xml += xmlE('AccntNumber', cleanNum);
  xml += buildXmlAddr(acct.addr||'', acct.city||'', acct.state||'', acct.zip||'', acct.country||'IN');
  if (btype.includes('Jointly')) {
    xml += xmlE('NOofJointOwners', acct.n_joint_owners || '');
    const jc = acct.joint_country || 'IN';
    xml += `<ffbar:PrincipalJointOwner>`
      + xmlE('TIN', acct.joint_tin||'') + xmlE('TINType', acct.joint_tin_type||'')
      + xmlE('IndividualLastName', acct.joint_last||'') + xmlE('IndividualFirstName', acct.joint_first||'')
      + buildXmlAddr('','','','',jc)
      + `</ffbar:PrincipalJointOwner>`;
  }
  return `<ffbar:${btype}>${xml}</ffbar:${btype}>`;
}

function buildNewDatasetsXML(fi, accounts, year) {
  const filerLabel = fi ? (fi.last_name || '') : '';
  const filingName = fi && fi.filing_name_base ? fi.filing_name_base + ' FBAR ' + year : 'FBAR ' + year;
  const acctBlocks = accounts.map(buildAccountBlockXML).join('');
  return `<?xml version="1.0" encoding="UTF-8"?>`
    + `<xfa:datasets xmlns:xfa="http://www.xfa.org/schema/xfa-data/1.0/">`
    + `<xfa:data>`
    + `<ffbar:BSAForm ${FFBAR_NS_ATTRS}>`
    + (fi ? (
        `<est:FilingName>${filingName}</est:FilingName>`
      + (fi.filing_type ? `<est:FilingType>${fi.filing_type}</est:FilingType>` : '')
      + (fi.submit_url ? `<est:SubmitUrl>${fi.submit_url}</est:SubmitUrl>` : '')
      + `<ffbar:FilerInformation>`
      + xmlE('TIN', fi.tin) + xmlE('TINType', fi.tin_type)
      + xmlE('IndividualLastName', fi.last_name) + xmlE('IndividualFirstName', fi.first_name)
      + xmlE('MiddleName', fi.middle_name) + xmlE('Suffix', fi.suffix_filer)
      + xmlE('DateOfBirth', fi.dob) + xmlE('TypeOfFiler', fi.type_of_filer)
      + buildXmlAddr(fi.addr, fi.city, fi.state, fi.zip, fi.country)
      + `</ffbar:FilerInformation>`
    ) : '')
    + acctBlocks
    + `</ffbar:BSAForm>`
    + `</xfa:data>`
    + `</xfa:datasets>`;
}

async function compressXmlStr(str) {
  const enc = new TextEncoder().encode(str);
  const inputStream = new ReadableStream({ start(c) { c.enqueue(enc); c.close(); } });
  const cs = new CompressionStream('deflate');
  const reader = inputStream.pipeThrough(cs).getReader();
  const parts = [];
  while (true) { const {done, value} = await reader.read(); if (done) break; parts.push(value); }
  const out = new Uint8Array(parts.reduce((a,b) => a+b.length, 0));
  let off = 0; parts.forEach(p => { out.set(p, off); off += p.length; });
  return out;
}

function buildEmbeddedFileObjBytes(objNum, objGen, compressed) {
  const header = `${objNum} ${objGen} obj\r<</Filter[/FlateDecode]/Length ${compressed.length}/Type/EmbeddedFile>>stream\r\n`;
  const footer = `\rendstream\r\nendobj\r\n`;
  const hBytes = new TextEncoder().encode(header);
  const fBytes = new TextEncoder().encode(footer);
  const out = new Uint8Array(hBytes.length + compressed.length + fBytes.length);
  out.set(hBytes, 0);
  out.set(compressed, hBytes.length);
  out.set(fBytes, hBytes.length + compressed.length);
  return out;
}

async function findXFADatasetsStreamInfo(bytes) {
  async function tryDecompressChunk(chunk) {
    const attempts = [['deflate', chunk], ['deflate-raw', chunk]];
    if (chunk.length > 2 && chunk[0] === 0x78) attempts.push(['deflate-raw', chunk.slice(2)]);
    for (const [fmt, data] of attempts) {
      try {
        const inputStream = new ReadableStream({ start(c) { c.enqueue(data); c.close(); } });
        const reader = inputStream.pipeThrough(new DecompressionStream(fmt)).getReader();
        const parts = [];
        while (true) { const {done, value} = await reader.read(); if (done) break; parts.push(value); }
        const out = new Uint8Array(parts.reduce((a,b) => a+b.length, 0));
        let off = 0; parts.forEach(p => { out.set(p, off); off += p.length; });
        return new TextDecoder('utf-8', {fatal:false}).decode(out);
      } catch(_) {}
    }
    return null;
  }
  function matchAt(arr, pos, marker) {
    if (pos + marker.length > arr.length) return false;
    for (let k = 0; k < marker.length; k++) if (arr[pos+k] !== marker[k]) return false;
    return true;
  }
  // 'stream' keyword bytes (6)
  const STREAM_KW = [115,116,114,101,97,109];
  // 'endstream' bytes (9)
  const ENDSTREAM_KW = [101,110,100,115,116,114,101,97,109];
  // endobj text
  const EO = [101,110,100,111,98,106];

  for (let i = 0; i < bytes.length - 7; i++) {
    if (bytes[i] !== 115) continue;
    if (!matchAt(bytes, i, STREAM_KW)) continue;
    // Accept stream\r\n or stream\n (real FinCEN PDFs use LF-only)
    let streamDataStart = -1;
    if (bytes[i+6] === 13 && bytes[i+7] === 10) streamDataStart = i + 8; // CRLF
    else if (bytes[i+6] === 10) streamDataStart = i + 7;                  // LF only
    if (streamDataStart < 0) continue;
    // Find endstream — preceded by \r or \n
    let endStreamPos = -1;
    for (let j = streamDataStart; j < bytes.length - ENDSTREAM_KW.length; j++) {
      if ((bytes[j] === 13 || bytes[j] === 10) && matchAt(bytes, j + 1, ENDSTREAM_KW)) {
        endStreamPos = j; break;
      }
    }
    if (endStreamPos < 0 || endStreamPos <= streamDataStart) continue;
    const chunk = bytes.slice(streamDataStart, endStreamPos);
    const text = await tryDecompressChunk(chunk);
    if (!text) continue;
    const normalized = text.replace(/\n>/g, '>').replace(/\r>/g, '>');
    // Match any valid FBAR XFA stream — don't require FinInstName (trusts may have 0 accounts)
    if (!normalized.includes('<xfa:datasets') || !normalized.includes('ffbar:BSAForm')) continue;

    // Found the datasets stream — now find the object header by scanning backward
    let objStart = -1, objNum = 0, objGen = 0;
    // Scan backward from i to find a line ending with 'obj\r'
    for (let back = i - 1; back >= 0; back--) {
      if (bytes[back] !== 10) continue; // look for newline
      // Check the bytes from back+1 for "N G obj\r" pattern
      let lineEnd = back + 1;
      while (lineEnd < i && bytes[lineEnd] !== 13 && bytes[lineEnd] !== 10) lineEnd++;
      const lineBytes = bytes.slice(back + 1, lineEnd);
      const lineStr = new TextDecoder().decode(lineBytes);
      const m = lineStr.match(/^(\d+)\s+(\d+)\s+obj\s*$/);
      if (m) {
        objNum = parseInt(m[1]);
        objGen = parseInt(m[2]);
        objStart = back + 1;
        break;
      }
    }
    if (objStart < 0) continue;

    // Find endobj after endstream (endStreamPos = CR/LF before endstream, +1+9 = past 'endstream')
    let endObjPos = endStreamPos + 1 + ENDSTREAM_KW.length;
    for (let j = endObjPos; j < bytes.length - EO.length; j++) {
      if (matchAt(bytes, j, EO)) { endObjPos = j + EO.length; break; }
    }
    // Skip trailing whitespace
    let slotEnd = endObjPos;
    while (slotEnd < bytes.length && (bytes[slotEnd] === 13 || bytes[slotEnd] === 10 || bytes[slotEnd] === 32)) slotEnd++;

    return { objStart, objNum, objGen, slotEnd, currentXML: normalized };
  }
  return null;
}

async function generateRealFbarPdf() {
  const fb = S.fbar;
  // Find template prev FBAR
  const tmplIdx = fbarFileObjects.findIndex((_, i) => fb.files[i]?.fileType === 'prev_fbar');
  if (tmplIdx < 0) { alert('Please upload a previous year FBAR PDF first.'); return; }

  const genBtn = document.getElementById('fbarGeneratePdfBtn');
  if (genBtn) { genBtn.disabled = true; genBtn.textContent = '⏳ Generating…'; }

  try {
    const templateFile = fbarFileObjects[tmplIdx];
    const buf = await templateFile.arrayBuffer();
    const bytes = new Uint8Array(buf);

    const dsInfo = await findXFADatasetsStreamInfo(bytes);
    if (!dsInfo) throw new Error('Could not locate XFA datasets stream in PDF template.');

    const filerInfo = fb.filerInfo || parseFilerInfoXFA(dsInfo.currentXML);
    const included = fb.accounts.filter(a => a.include !== false && a.newMax != null);
    if (included.length === 0) throw new Error('No accounts with balances to include.');

    const newXML = buildNewDatasetsXML(filerInfo, included, fb.year);
    const compressed = await compressXmlStr(newXML);
    const newObjBytes = buildEmbeddedFileObjBytes(dsInfo.objNum, dsInfo.objGen, compressed);

    const slotSize = dsInfo.slotEnd - dsInfo.objStart;
    if (newObjBytes.length > slotSize) {
      throw new Error('New XML is too large for the PDF slot (' + newObjBytes.length + ' vs ' + slotSize + ' bytes). Reduce the number of accounts or use a larger template.');
    }

    // Create copy and overwrite
    const outBytes = new Uint8Array(bytes);
    outBytes.set(newObjBytes, dsInfo.objStart);
    // Pad remainder with spaces
    for (let k = dsInfo.objStart + newObjBytes.length; k < dsInfo.slotEnd; k++) outBytes[k] = 0x20;

    const filerLabel = filerInfo ? (filerInfo.last_name ? filerInfo.last_name + '_' : '') : '';
    const filename = filerLabel + 'FBAR' + fb.year + '.pdf';
    const blob = new Blob([outBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);

    fb.completed = true;
    saveFbarData();
    setTimeout(() => render(), 2000);
  } catch(e) {
    if (genBtn) { genBtn.disabled = false; genBtn.textContent = '⬇ Generate FBAR PDF'; }
    alert('PDF generation error: ' + e.message);
  }
}
